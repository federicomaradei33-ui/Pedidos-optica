<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óptica Connect - Sistema de Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        .loader {
            border-top-color: #3498db;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        <div class="bg-blue-600 p-6 text-center">
            <h1 class="text-2xl font-bold text-white tracking-tight italic uppercase">ÓPTICA <span class="text-blue-200">CONNECT</span></h1>
            <p class="text-blue-100 text-sm mt-1">Panel de Pedidos de Laboratorio</p>
        </div>
        
        <form id="optica-form" class="p-6 space-y-5">
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Nombre del Paciente</label>
                <input type="text" id="p_name" placeholder="Ej: Juan Pérez" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition" required>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">OD (Esfera)</label>
                    <input type="text" id="od_esf" placeholder="+1.25" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">OI (Esfera)</label>
                    <input type="text" id="oi_esf" placeholder="-0.75" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Tipo de Cristal</label>
                <select id="lente_tipo" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none appearance-none">
                    <option value="Monofocal">Monofocal</option>
                    <option value="Bifocal">Bifocal</option>
                    <option value="Multifocal">Multifocal</option>
                    <option value="Ocupacional">Ocupacional</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Observaciones / Armazón</label>
                <textarea id="notas" placeholder="Detalles adicionales..." class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none h-24 resize-none"></textarea>
            </div>

            <button type="submit" id="btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-200 transition-all active:scale-[0.98] flex justify-center items-center">
                <span>ENVIAR PEDIDO</span>
            </button>
        </form>

        <div id="status-container" class="px-6 pb-6 hidden">
            <div id="status-message" class="p-4 rounded-xl text-center text-sm font-semibold"></div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN CRÍTICA
        const PUBLIC_KEY = "-NKT0dntx3JOPXYAA"; 
        const SERVICE_ID = "service_bo6kzuc";
        const TEMPLATE_ID = "template_4e00pyr";

        emailjs.init(PUBLIC_KEY);

        const form = document.getElementById('optica-form');
        const btn = document.getElementById('btn');
        const statusContainer = document.getElementById('status-container');
        const statusMessage = document.getElementById('status-message');

        form.onsubmit = function(event) {
            event.preventDefault();
            
            btn.disabled = true;
            btn.innerHTML = '<div class="loader ease-linear rounded-full border-2 border-t-2 border-gray-200 h-5 w-5 mr-3"></div> ENVIANDO...';
            
            statusContainer.classList.remove('hidden');
            statusMessage.className = "p-4 rounded-xl text-center text-sm font-semibold bg-blue-50 text-blue-700 border border-blue-100";
            statusMessage.innerText = "Conectando con el servidor...";

            const templateParams = {
                patient_name: document.getElementById('p_name').value,
                graduacion: `OD: ${document.getElementById('od_esf').value} | OI: ${document.getElementById('oi_esf').value}`,
                lente: document.getElementById('lente_tipo').value,
                observaciones: document.getElementById('notas').value,
                order_id: Math.floor(10000 + Math.random() * 90000)
            };

            emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams)
                .then(function(response) {
                    statusMessage.className = "p-4 rounded-xl text-center text-sm font-semibold bg-green-50 text-green-700 border border-green-100";
                    statusMessage.innerText = "✅ ¡Pedido enviado correctamente!";
                    btn.innerHTML = "¡ENVIADO!";
                    btn.classList.replace('bg-blue-600', 'bg-green-600');
                    form.reset();
                }, function(error) {
                    statusMessage.className = "p-4 rounded-xl text-center text-sm font-semibold bg-red-50 text-red-700 border border-red-100";
                    statusMessage.innerHTML = `❌ Error al enviar.<br><span class="text-xs font-normal">${error.text || 'Revisá la configuración'}</span>`;
                    btn.disabled = false;
                    btn.innerHTML = "REINTENTAR ENVÍO";
                });
        };
    </script>
</body>
</html>
