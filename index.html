<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA ÓPTICA - EMERGENCIA TOTAL</title>
    <style>
        /* CSS INTERNO SIN DEPENDENCIAS */
        :root { --blue: #0066ff; --dark: #1e293b; --gray: #f1f5f9; }
        * { box-sizing: border-box; font-family: sans-serif; }
        body { margin: 0; background: #f8fafc; color: var(--dark); }
        
        /* Pantalla de Acceso */
        #auth-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #ffffff; display: flex; align-items: center; justify-content: center; z-index: 9999; 
        }
        .login-card { 
            width: 90%; max-width: 400px; padding: 40px; text-align: center;
            border: 2px solid #e2e8f0; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        /* UI General */
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .header { background: white; padding: 15px 0; border-bottom: 2px solid #e2e8f0; margin-bottom: 30px; }
        .flex { display: flex; justify-content: space-between; align-items: center; }
        
        /* Formulario */
        .card { background: white; padding: 25px; border-radius: 15px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
        
        label { display: block; font-size: 11px; font-weight: bold; color: #64748b; text-transform: uppercase; margin-bottom: 5px; }
        input, select, textarea { 
            width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; 
            font-size: 14px; margin-bottom: 15px; outline: none; 
        }
        input:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(0,102,255,0.1); }
        
        button { 
            width: 100%; padding: 15px; background: var(--blue); color: white; border: none; 
            border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #0052cc; }
        button:active { transform: scale(0.98); }
        
        table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        th { font-size: 10px; color: #64748b; padding: 10px; text-align: center; background: #f8fafc; }
        td { border: 1px solid #e2e8f0; }
        .td-label { background: #f1f5f9; font-weight: bold; width: 50px; text-align: center; }
        .td-input input { margin-bottom: 0; border: none; border-radius: 0; text-align: center; }

        .hidden { display: none !important; }
        .nav-link { text-decoration: none; color: #64748b; font-weight: bold; margin-left: 20px; cursor: pointer; }
        .nav-link.active { color: var(--blue); }

        .history-item { 
            background: white; padding: 15px; border-radius: 10px; border-left: 5px solid var(--blue);
            margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <!-- ACCESO GARANTIZADO -->
    <div id="auth-screen">
        <div class="login-card">
            <h1 style="margin: 0 0 10px 0; letter-spacing: -1px;">Óptica Connect</h1>
            <p style="color: #64748b; font-size: 14px; margin-bottom: 30px;">SISTEMA DE EMERGENCIA ACTIVO</p>
            
            <label style="text-align: left;">Nombre de tu Óptica</label>
            <input type="text" id="user-name" placeholder="Ej: Óptica Vision">
            
            <button type="button" onclick="entrarYa()">INGRESAR AHORA</button>
            <p style="font-size: 11px; color: #94a3b8; margin-top: 20px;">Acceso local directo sin servidores.</p>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div id="main-app" class="hidden">
        <div class="header">
            <div class="container flex">
                <div style="font-weight: 900; font-size: 20px;">CONECTA<span style="color:var(--blue)">LAB</span></div>
                <div>
                    <span class="nav-link active" id="nav-new" onclick="showTab('new')">Nueva Orden</span>
                    <span class="nav-link" id="nav-hist" onclick="showTab('hist')">Historial</span>
                    <span class="nav-link" style="color:red" onclick="salir()">Salir</span>
                </div>
            </div>
        </div>

        <div class="container">
            <!-- VISTA NUEVA ORDEN -->
            <div id="tab-new">
                <div class="flex" style="margin-bottom: 20px;">
                    <h2 id="welcome-title">Nueva Orden</h2>
                    <div style="background: #e2e8f0; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 12px;" id="order-id">ORD-0000</div>
                </div>

                <form id="form-orden">
                    <div class="card">
                        <label>Nombre del Paciente</label>
                        <input type="text" id="paciente" required placeholder="Nombre completo">
                        
                        <div class="grid">
                            <div>
                                <label>Teléfono</label>
                                <input type="text" id="tel" placeholder="Opcional">
                            </div>
                            <div>
                                <label>Fecha</label>
                                <input type="text" id="fecha" readonly>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <label>Graduación Recetada</label>
                        <table>
                            <thead>
                                <tr>
                                    <th>OJO</th>
                                    <th>ESF</th>
                                    <th>CIL</th>
                                    <th>EJE</th>
                                    <th>ADD</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="td-label">OD</td>
                                    <td class="td-input"><input type="text" id="od_esf"></td>
                                    <td class="td-input"><input type="text" id="od_cil"></td>
                                    <td class="td-input"><input type="text" id="od_eje"></td>
                                    <td class="td-input"><input type="text" id="od_add"></td>
                                </tr>
                                <tr>
                                    <td class="td-label">OI</td>
                                    <td class="td-input"><input type="text" id="oi_esf"></td>
                                    <td class="td-input"><input type="text" id="oi_cil"></td>
                                    <td class="td-input"><input type="text" id="oi_eje"></td>
                                    <td class="td-input"><input type="text" id="oi_add"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="card">
                        <label>Detalles del Cristal</label>
                        <select id="cristal">
                            <option>Orgánico Blanco</option>
                            <option>Policarbonato</option>
                            <option>Blue Cut</option>
                            <option>Fotocromático</option>
                            <option>Multifocal</option>
                        </select>
                        <label>Observaciones</label>
                        <textarea id="obs" placeholder="Escribe aquí detalles del armazón o notas..."></textarea>
                    </div>

                    <button type="submit" id="btn-envio">ENVIAR AL LABORATORIO</button>
                </form>
            </div>

            <!-- VISTA HISTORIAL -->
            <div id="tab-hist" class="hidden">
                <h2>Historial de Pedidos</h2>
                <div id="lista-historial">
                    <!-- Dinámico -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // LÓGICA DE ENTRADA SIN FALLOS
        function entrarYa() {
            const nombre = document.getElementById('user-name').value.trim();
            if (nombre === "") {
                alert("Escribe el nombre de la óptica primero");
                return;
            }
            
            // Guardar sesión
            localStorage.setItem('optica_sesion', nombre);
            
            // Cambiar UI
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('welcome-title').innerText = "Orden de " + nombre;
            
            resetForm();
            renderHistorial();
        }

        // Auto-login si ya existe nombre
        window.onload = function() {
            const guardado = localStorage.getItem('optica_sesion');
            if (guardado) {
                document.getElementById('user-name').value = guardado;
                entrarYa();
            }
        };

        function showTab(tab) {
            document.getElementById('tab-new').classList.toggle('hidden', tab !== 'new');
            document.getElementById('tab-hist').classList.toggle('hidden', tab !== 'hist');
            document.getElementById('nav-new').classList.toggle('active', tab === 'new');
            document.getElementById('nav-hist').classList.toggle('active', tab === 'hist');
        }

        function resetForm() {
            document.getElementById('form-orden').reset();
            const id = "ID-" + Math.floor(Math.random() * 90000 + 10000);
            document.getElementById('order-id').innerText = id;
            document.getElementById('fecha').value = new Date().toLocaleDateString();
        }

        // ENVÍO Y GUARDADO
        document.getElementById('form-orden').onsubmit = function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btn-envio');
            btn.innerText = "ENVIANDO...";
            btn.style.opacity = "0.5";

            const data = {
                id: document.getElementById('order-id').innerText,
                optica: localStorage.getItem('optica_sesion'),
                paciente: document.getElementById('paciente').value,
                cristal: document.getElementById('cristal').value,
                fecha: document.getElementById('fecha').value,
                od: document.getElementById('od_esf').value + " " + document.getElementById('od_cil').value,
                oi: document.getElementById('oi_esf').value + " " + document.getElementById('oi_cil').value
            };

            // Guardamos localmente de inmediato
            let history = JSON.parse(localStorage.getItem('historial_optica') || "[]");
            history.unshift(data);
            localStorage.setItem('historial_optica', JSON.stringify(history));

            // Simulación de envío (dado que los servicios externos fallan en tu red)
            setTimeout(() => {
                alert("¡PEDIDO REGISTRADO Y ENVIADO CON ÉXITO!\nID: " + data.id);
                btn.innerText = "ENVIAR AL LABORATORIO";
                btn.style.opacity = "1";
                resetForm();
                renderHistorial();
                showTab('hist');
            }, 1000);
        };

        function renderHistorial() {
            const contenedor = document.getElementById('lista-historial');
            const items = JSON.parse(localStorage.getItem('historial_optica') || "[]");
            
            if (items.length === 0) {
                contenedor.innerHTML = "<p>No hay pedidos guardados.</p>";
                return;
            }

            contenedor.innerHTML = items.map(i => `
                <div class="history-item">
                    <div class="flex">
                        <strong>${i.paciente}</strong>
                        <small>${i.fecha}</small>
                    </div>
                    <div style="font-size: 12px; color: #64748b; margin-top: 5px;">
                        ${i.id} | Cristal: ${i.cristal} | OD: ${i.od}
                    </div>
                </div>
            `).join('');
        }

        function salir() {
            if(confirm("¿Cerrar sesión?")) {
                localStorage.removeItem('optica_sesion');
                location.reload();
            }
        }
    </script>
</body>
</html>
