<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óptica Connect - Sistema de Emergencia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .login-card { background: white; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .input-group input { @apply w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all; }
        .loader-spin {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Pantalla de Login -->
    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-100 to-blue-50">
        <div class="login-card p-8 w-full max-w-md">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-600 text-white rounded-xl mb-3 shadow-lg">
                    <i class="fas fa-glasses text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">Óptica Connect</h1>
                <p class="text-slate-500 text-sm">Acceso al Laboratorio</p>
            </div>

            <!-- Tabs -->
            <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
                <button id="tab-login" onclick="setTab('login')" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white shadow text-blue-600">INGRESAR</button>
                <button id="tab-reg" onclick="setTab('reg')" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-500">CREAR CUENTA</button>
            </div>

            <!-- Formularios -->
            <div id="login-form" class="space-y-4">
                <div class="input-group">
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Usuario</label>
                    <input type="text" id="l-user" placeholder="Ej: sucursal1" autocomplete="off">
                </div>
                <div class="input-group">
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Contraseña</label>
                    <input type="password" id="l-pass" placeholder="••••">
                </div>
                <button onclick="handleLogin()" id="btn-login" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-all shadow-lg flex justify-center items-center gap-2">
                    <span>ENTRAR</span>
                    <div id="l-loader" class="loader-spin"></div>
                </button>
            </div>

            <div id="reg-form" class="hidden space-y-4">
                <div class="input-group">
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Nuevo Usuario</label>
                    <input type="text" id="r-user" placeholder="Nombre de tu óptica">
                </div>
                <div class="input-group">
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Nueva Contraseña</label>
                    <input type="password" id="r-pass" placeholder="Mínimo 4 caracteres">
                </div>
                <button onclick="handleRegister()" id="btn-reg" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold hover:bg-emerald-700 transition-all shadow-lg flex justify-center items-center gap-2">
                    <span>REGISTRARSE</span>
                    <div id="r-loader" class="loader-spin"></div>
                </button>
            </div>

            <div id="error-msg" class="mt-4 p-3 bg-red-50 text-red-600 text-xs rounded-lg hidden text-center font-medium border border-red-100"></div>
        </div>
    </div>

    <!-- Contenido App (Solo visible al loguear) -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col items-center justify-center p-6 text-center">
        <div class="bg-white p-10 rounded-3xl shadow-xl max-w-sm w-full">
            <i class="fas fa-check-circle text-6xl text-emerald-500 mb-4"></i>
            <h2 class="text-2xl font-bold text-slate-800">¡Acceso Correcto!</h2>
            <p class="text-slate-500 mt-2">Bienvenido, <span id="user-display" class="font-bold text-blue-600"></span></p>
            <button onclick="location.reload()" class="mt-8 text-slate-400 text-sm hover:text-slate-600">Cerrar Sesión</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuración directa
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'optica-connect-v1';

        // Manejo de UI
        window.setTab = (mode) => {
            const isLogin = mode === 'login';
            document.getElementById('login-form').classList.toggle('hidden', !isLogin);
            document.getElementById('reg-form').classList.toggle('hidden', isLogin);
            document.getElementById('tab-login').className = isLogin ? "flex-1 py-2 text-xs font-bold rounded-lg bg-white shadow text-blue-600" : "flex-1 py-2 text-xs font-bold rounded-lg text-slate-500";
            document.getElementById('tab-reg').className = !isLogin ? "flex-1 py-2 text-xs font-bold rounded-lg bg-white shadow text-emerald-600" : "flex-1 py-2 text-xs font-bold rounded-lg text-slate-500";
            document.getElementById('error-msg').classList.add('hidden');
        };

        const showError = (msg) => {
            const el = document.getElementById('error-msg');
            el.innerText = msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        };

        // Lógica de Registro
        window.handleRegister = async () => {
            const u = document.getElementById('r-user').value.trim().toLowerCase();
            const p = document.getElementById('r-pass').value.trim();
            const loader = document.getElementById('r-loader');

            if (!u || p.length < 4) return showError("Completa los datos (Clave mín. 4 letras)");

            loader.style.display = 'block';
            try {
                // Autenticamos primero para tener permiso de escritura
                await signInAnonymously(auth);
                
                // Ruta estricta de Firebase según Regla 1
                const userPath = doc(db, 'artifacts', appId, 'public', 'data', 'users', u);
                const check = await getDoc(userPath);
                
                if (check.exists()) {
                    showError("Ese usuario ya existe. Prueba otro.");
                } else {
                    await setDoc(userPath, { p: p, created: new Date().toISOString() });
                    alert("¡Cuenta creada con éxito! Ahora ingresa.");
                    setTab('login');
                }
            } catch (err) {
                console.error(err);
                showError("Error de conexión: " + err.code);
            } finally {
                loader.style.display = 'none';
            }
        };

        // Lógica de Login
        window.handleLogin = async () => {
            const u = document.getElementById('l-user').value.trim().toLowerCase();
            const p = document.getElementById('l-pass').value.trim();
            const loader = document.getElementById('l-loader');

            if (!u || !p) return showError("Ingresa usuario y clave");

            loader.style.display = 'block';
            try {
                await signInAnonymously(auth);
                
                const userPath = doc(db, 'artifacts', appId, 'public', 'data', 'users', u);
                const snap = await getDoc(userPath);

                if (snap.exists()) {
                    const data = snap.data();
                    if (data.p === p) {
                        // ÉXITO
                        document.getElementById('auth-screen').classList.add('hidden');
                        document.getElementById('app-screen').classList.remove('hidden');
                        document.getElementById('user-display').innerText = u;
                    } else {
                        showError("Contraseña incorrecta");
                    }
                } else {
                    showError("El usuario no existe");
                }
            } catch (err) {
                showError("Fallo de red: " + err.message);
            } finally {
                loader.style.display = 'none';
            }
        };

        // Autenticación inicial silenciosa
        signInAnonymously(auth).catch(e => console.log("Auth error silent", e));

    </script>
</body>
</html>
