<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óptica Pro - Sistema de Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --primary: #2563eb;
            --secondary: #64748b;
            --accent: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .order-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .order-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-900">

    <!-- Status Bar (Cloud Sync) -->
    <div id="sync-indicator" class="fixed top-4 right-4 z-50 flex items-center gap-2 px-3 py-1.5 rounded-full bg-white shadow-sm border border-slate-200 text-[10px] font-bold tracking-tighter transition-all">
        <div id="sync-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></div>
        <span id="sync-text" class="text-slate-500 uppercase">Sincronizando...</span>
    </div>

    <!-- Navigation -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 p-2 rounded-lg text-white">
                        <i class="fas fa-eye-low-vision fa-lg"></i>
                    </div>
                    <div>
                        <span class="text-xl font-bold tracking-tight">Óptica<span class="text-blue-600">Pro</span></span>
                        <span class="block text-[10px] text-slate-400 font-bold uppercase leading-none">Cloud Management</span>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition-all flex items-center gap-2">
                        <i class="fas fa-plus"></i>
                        <span class="hidden sm:inline">Nueva Orden</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        
        <!-- Dashboard Stats -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-slate-400 text-xs font-bold uppercase mb-1">Total Mensual</p>
                <h3 class="text-2xl font-extrabold" id="stat-total">0</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-blue-500 text-xs font-bold uppercase mb-1">Pendientes</p>
                <h3 class="text-2xl font-extrabold text-blue-600" id="stat-pending">0</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-emerald-500 text-xs font-bold uppercase mb-1">Entregados</p>
                <h3 class="text-2xl font-extrabold text-emerald-600">0</h3>
            </div>
            <div class="bg-slate-900 p-6 rounded-2xl shadow-xl text-white">
                <p class="text-slate-400 text-xs font-bold uppercase mb-1">ID Sesión</p>
                <h3 class="text-sm font-mono truncate" id="user-id-display">Cargando...</h3>
            </div>
        </div>

        <!-- Section Title -->
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                <i class="fas fa-list-ul text-blue-500"></i>
                Historial de Trabajos
            </h2>
            <div class="flex gap-2">
                <button class="p-2 bg-white border border-slate-200 rounded-lg text-slate-400 hover:text-blue-600 transition-colors">
                    <i class="fas fa-filter"></i>
                </button>
            </div>
        </div>

        <!-- Orders Grid -->
        <div id="orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Loading State -->
            <div class="col-span-full py-20 text-center">
                <i class="fas fa-circle-notch animate-spin text-4xl text-blue-200 mb-4"></i>
                <p class="text-slate-400 font-medium">Sincronizando base de datos...</p>
            </div>
        </div>
    </main>

    <!-- Modal: Nueva Orden -->
    <div id="order-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm hidden">
        <div class="bg-white w-full max-w-2xl rounded-[2rem] shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="text-xl font-bold text-slate-800">Nueva Orden de Trabajo</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fas fa-times fa-lg"></i>
                </button>
            </div>
            
            <form id="order-form" class="p-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Nombre del Paciente</label>
                        <input type="text" id="paciente" required class="w-full bg-slate-50 border border-slate-200 p-4 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all" placeholder="Nombre completo">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Armazón / Lente</label>
                        <input type="text" id="armazon" required class="w-full bg-slate-50 border border-slate-200 p-4 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all" placeholder="Modelo o Marca">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Graduación</label>
                        <input type="text" id="graduacion" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all" placeholder="OD / OI">
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Email del Laboratorio</label>
                        <input type="email" id="email-lab" required class="w-full bg-slate-50 border border-slate-200 p-4 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all" placeholder="correo@laboratorio.com">
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Observaciones</label>
                        <textarea id="observaciones" rows="3" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all" placeholder="Detalles de fabricación..."></textarea>
                    </div>
                </div>

                <div class="mt-8 flex gap-3">
                    <button type="button" onclick="closeModal()" class="flex-1 px-6 py-4 border border-slate-200 rounded-xl font-bold text-slate-500 hover:bg-slate-50 transition-all">
                        Cancelar
                    </button>
                    <button type="submit" id="submit-btn" class="flex-[2] px-6 py-4 bg-blue-600 text-white rounded-xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all flex items-center justify-center gap-2">
                        <i class="fas fa-paper-plane"></i>
                        Guardar y Enviar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[100] px-6 py-3 rounded-full bg-slate-900 text-white text-sm font-bold shadow-2xl transition-all translate-y-20 opacity-0 pointer-events-none flex items-center gap-3">
        <i class="fas fa-check-circle text-emerald-400"></i>
        <span id="toast-msg">Operación exitosa</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, query, deleteDoc, doc, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Initialize Firebase
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'optica-pro-global';

        // State
        let currentUser = null;

        // UI Handlers
        window.openModal = () => document.getElementById('order-modal').classList.remove('hidden');
        window.closeModal = () => document.getElementById('order-modal').classList.add('hidden');

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        // Firebase Auth
        const startSession = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    // Si el entorno provee token
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth Error", err);
                document.getElementById('sync-text').innerText = "ERROR DE SYNC";
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('user-id-display').innerText = user.uid;
                document.getElementById('sync-dot').className = "w-2 h-2 rounded-full bg-emerald-500";
                document.getElementById('sync-text').innerText = "CONECTADO (CLOUD)";
                loadData();
            }
        });

        // Data Loading
        function loadData() {
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'ordenes');
            
            // Note: No usamos orderBy complejo para evitar necesidad de índices manuales según reglas
            onSnapshot(q, (snapshot) => {
                const grid = document.getElementById('orders-grid');
                let html = "";
                let count = 0;

                // Ordenar en memoria (JS) para cumplir con la Regla 2
                const docs = [];
                snapshot.forEach(d => docs.push({id: d.id, ...d.data()}));
                docs.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

                docs.forEach(data => {
                    count++;
                    const date = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleDateString() : 'Procesando...';
                    
                    html += `
                        <div class="bg-white rounded-3xl border border-slate-200 p-6 order-card relative overflow-hidden">
                            <div class="flex justify-between items-start mb-4">
                                <div class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-600">
                                    <i class="fas fa-file-invoice text-xl"></i>
                                </div>
                                <span class="text-[10px] font-black bg-blue-100 text-blue-600 px-3 py-1 rounded-full uppercase tracking-tighter">
                                    Enviado a Lab
                                </span>
                            </div>
                            
                            <h4 class="text-lg font-bold text-slate-800 mb-1">${data.paciente}</h4>
                            <p class="text-xs font-bold text-blue-500 uppercase tracking-widest mb-4">${data.armazon}</p>
                            
                            <div class="space-y-3 mb-6">
                                <div class="flex items-center gap-2 text-slate-500">
                                    <i class="fas fa-microscope text-[10px]"></i>
                                    <span class="text-xs font-medium truncate">${data.graduacion || 'N/A'}</span>
                                </div>
                                <div class="flex items-center gap-2 text-slate-500">
                                    <i class="fas fa-envelope text-[10px]"></i>
                                    <span class="text-xs font-medium truncate">${data.emailLab}</span>
                                </div>
                            </div>

                            <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                                <span class="text-[10px] font-bold text-slate-300 uppercase">${date}</span>
                                <div class="flex gap-2">
                                    <button onclick="window.borrarOrden('${data.id}')" class="w-8 h-8 rounded-lg bg-red-50 text-red-400 hover:bg-red-500 hover:text-white transition-all flex items-center justify-center">
                                        <i class="fas fa-trash text-[10px]"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                if (count === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full py-20 text-center bg-white rounded-[3rem] border-2 border-dashed border-slate-200">
                            <i class="fas fa-folder-plus text-slate-100 text-6xl mb-4"></i>
                            <p class="text-slate-400 font-bold">No hay órdenes registradas.</p>
                            <p class="text-xs text-slate-300">Las nuevas órdenes aparecerán aquí en tiempo real.</p>
                        </div>
                    `;
                } else {
                    grid.innerHTML = html;
                }

                document.getElementById('stat-total').innerText = count;
                document.getElementById('stat-pending').innerText = count;
            }, (err) => {
                console.error("Snapshot error:", err);
            });
        }

        // Action: Save Order
        document.getElementById('order-form').onsubmit = async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const btn = document.getElementById('submit-btn');
            const data = {
                paciente: document.getElementById('paciente').value,
                armazon: document.getElementById('armazon').value,
                graduacion: document.getElementById('graduacion').value,
                emailLab: document.getElementById('email-lab').value,
                observaciones: document.getElementById('observaciones').value,
                createdAt: serverTimestamp()
            };

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch animate-spin"></i> ENVIANDO...';

            try {
                // Simulación de envío de email al laboratorio
                console.log(`Enviando pedido a: ${data.emailLab}...`);
                
                // Guardar en Firestore
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'ordenes'), data);
                
                showToast("Orden enviada y guardada correctamente");
                closeModal();
                e.target.reset();
            } catch (err) {
                console.error("Save error:", err);
                showToast("Error al guardar en la nube");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Guardar y Enviar';
            }
        };

        // Action: Delete Order
        window.borrarOrden = async (id) => {
            if (!confirm("¿Eliminar este registro de forma permanente?")) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'ordenes', id));
                showToast("Registro eliminado");
            } catch (err) {
                console.error("Delete error:", err);
            }
        };

        startSession();

    </script>
</body>
</html>
