<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óptica Connect | Gestión de Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc;
        }

        /* Estilo para Radio Buttons Ocultos pero Funcionales */
        .selector-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .selector-option label {
            display: block;
            cursor: pointer;
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            transition: all 0.2s ease;
            position: relative;
            background: white;
        }

        .selector-option input[type="radio"]:checked + label {
            border-color: #2563eb;
            background-color: #eff6ff;
            box-shadow: 0 4px 12px -2px rgba(37, 99, 235, 0.15);
        }

        .selector-option input[type="radio"]:checked + label::after {
            content: "\f058";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: -8px;
            right: -8px;
            background: white;
            color: #2563eb;
            font-size: 1.2rem;
            border-radius: 50%;
            line-height: 1;
        }

        .loader {
            border-top-color: #2563eb;
            animation: spinner 0.6s linear infinite;
        }

        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 p-4">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <h1 class="font-extrabold text-lg text-slate-800 tracking-tight">ÓPTICA<span class="text-blue-600">CONNECT</span></h1>
            <div class="flex gap-2">
                <button onclick="switchView('form')" id="nav-form" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-md">NUEVO</button>
                <button onclick="switchView('list')" id="nav-list" class="bg-slate-100 text-slate-600 px-4 py-2 rounded-lg text-xs font-bold">HISTORIAL</button>
            </div>
        </div>
    </nav>

    <main class="max-w-xl mx-auto p-4 mb-20">
        
        <!-- VISTA FORMULARIO -->
        <div id="view-form" class="space-y-6">
            
            <!-- Paciente -->
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Información del Paciente</h3>
                <div class="space-y-4">
                    <input type="text" id="p_name" placeholder="Nombre completo del paciente" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-semibold">
                    <input type="text" id="p_id" placeholder="ID o Celular de contacto" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </section>

            <!-- Receta -->
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Graduación Técnica</h3>
                <div class="space-y-4">
                    <div class="grid grid-cols-4 gap-2 text-[10px] font-bold text-center text-slate-400 uppercase">
                        <span>Esf</span><span>Cil</span><span>Eje</span><span>Add</span>
                    </div>
                    <div class="grid grid-cols-4 gap-2">
                        <input type="text" id="od_esf" placeholder="OD" class="p-2 bg-blue-50 border border-blue-100 rounded-lg text-center font-bold">
                        <input type="text" id="od_cil" placeholder="Cil" class="p-2 bg-blue-50 border border-blue-100 rounded-lg text-center font-bold">
                        <input type="text" id="od_eje" placeholder="Eje" class="p-2 bg-blue-50 border border-blue-100 rounded-lg text-center font-bold">
                        <input type="text" id="od_add" placeholder="Add" class="p-2 bg-blue-50 border border-blue-100 rounded-lg text-center font-bold text-blue-600">
                    </div>
                    <div class="grid grid-cols-4 gap-2">
                        <input type="text" id="oi_esf" placeholder="OI" class="p-2 bg-slate-50 border border-slate-200 rounded-lg text-center font-bold">
                        <input type="text" id="oi_cil" placeholder="Cil" class="p-2 bg-slate-50 border border-slate-200 rounded-lg text-center font-bold">
                        <input type="text" id="oi_eje" placeholder="Eje" class="p-2 bg-slate-50 border border-slate-200 rounded-lg text-center font-bold">
                        <input type="text" id="oi_add" placeholder="Add" class="p-2 bg-slate-50 border border-slate-200 rounded-lg text-center font-bold text-blue-600">
                    </div>
                </div>
            </section>

            <!-- Cristal -->
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Tipo de Cristal</h3>
                <select id="lenses" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-700 outline-none">
                    <option value="Monofocal Stock">Monofocal Stock</option>
                    <option value="Monofocal Laboratorio">Monofocal Laboratorio</option>
                    <option value="Bifocal">Bifocal</option>
                    <option value="Multifocal Progresivo">Multifocal Progresivo</option>
                    <option value="Ocupacional">Ocupacional</option>
                </select>
            </section>

            <!-- Tratamiento -->
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Tratamiento</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div class="selector-option">
                        <input type="radio" name="treatment" id="t1" value="Sin Tratamiento" checked>
                        <label for="t1" class="text-center font-bold text-xs uppercase">Sin Tratamiento</label>
                    </div>
                    <div class="selector-option">
                        <input type="radio" name="treatment" id="t2" value="Antirreflex">
                        <label for="t2" class="text-center font-bold text-xs uppercase">Antirreflex</label>
                    </div>
                    <div class="selector-option">
                        <input type="radio" name="treatment" id="t3" value="Filtro Azul">
                        <label for="t3" class="text-center font-bold text-xs uppercase">Filtro Azul</label>
                    </div>
                    <div class="selector-option">
                        <input type="radio" name="treatment" id="t4" value="Fotocromático">
                        <label for="t4" class="text-center font-bold text-xs uppercase">Fotocromático</label>
                    </div>
                </div>
            </section>

            <!-- Armazón -->
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Armazón</h3>
                <div class="grid grid-cols-3 gap-3 mb-4">
                    <div class="selector-option">
                        <input type="radio" name="frame" id="f1" value="Zilo" checked>
                        <label for="f1" class="text-center font-bold text-[10px] uppercase">Zilo</label>
                    </div>
                    <div class="selector-option">
                        <input type="radio" name="frame" id="f2" value="Metal">
                        <label for="f2" class="text-center font-bold text-[10px] uppercase">Metal</label>
                    </div>
                    <div class="selector-option">
                        <input type="radio" name="frame" id="f3" value="Ranura">
                        <label for="f3" class="text-center font-bold text-[10px] uppercase">Ranura</label>
                    </div>
                </div>
                <input type="text" id="f_details" placeholder="Marca/Modelo del armazón" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
            </section>

            <!-- Notas -->
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Notas Taller</h3>
                <textarea id="notes" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl min-h-[100px] outline-none" placeholder="Instrucciones adicionales..."></textarea>
            </section>

            <button onclick="handleOrderSubmission()" id="btn-submit" class="w-full bg-blue-600 text-white p-5 rounded-2xl font-black text-lg shadow-xl shadow-blue-200 active:scale-95 transition-transform uppercase tracking-tighter">
                Enviar Pedido
            </button>
        </div>

        <!-- HISTORIAL -->
        <div id="view-list" class="hidden space-y-4">
            <h2 class="font-black text-slate-800 text-sm uppercase px-2 italic underline decoration-blue-500">Historial Reciente</h2>
            <div id="orders-list" class="space-y-3"></div>
        </div>

    </main>

    <!-- Overlay de Carga -->
    <div id="loading-overlay" class="fixed inset-0 bg-white/90 z-[100] hidden flex-col items-center justify-center">
        <div class="loader rounded-full border-4 border-slate-200 h-16 w-16 mb-6"></div>
        <p class="text-sm font-black text-slate-600 uppercase tracking-widest animate-pulse">Procesando Pedido...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuración Firebase (inyectada por el entorno)
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'optica-connect-default';

        // Inicializar EmailJS
        emailjs.init("-NKT0dntx3JOPXYAA");

        // Autenticación Anónima
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("Autenticado como:", user.uid);
                loadHistory();
            }
        });
        signInAnonymously(auth).catch(err => console.error("Error Auth:", err));

        // Gestión de Vistas
        window.switchView = (v) => {
            document.getElementById('view-form').classList.toggle('hidden', v !== 'form');
            document.getElementById('view-list').classList.toggle('hidden', v !== 'list');
            document.getElementById('nav-form').className = v === 'form' ? 'bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-md' : 'bg-slate-100 text-slate-600 px-4 py-2 rounded-lg text-xs font-bold';
            document.getElementById('nav-list').className = v === 'list' ? 'bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-md' : 'bg-slate-100 text-slate-600 px-4 py-2 rounded-lg text-xs font-bold';
        };

        // Lógica de Envío Principal
        window.handleOrderSubmission = async () => {
            const name = document.getElementById('p_name').value.trim();
            
            if (!name) {
                alert("Por favor, ingresa el nombre del paciente.");
                return;
            }

            // Mostrar Cargando
            const overlay = document.getElementById('loading-overlay');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');

            try {
                // Recolectar datos de Radio Buttons de forma segura
                const treatmentElement = document.querySelector('input[name="treatment"]:checked');
                const frameElement = document.querySelector('input[name="frame"]:checked');
                
                const treatmentVal = treatmentElement ? treatmentElement.value : "No seleccionado";
                const frameVal = frameElement ? frameElement.value : "No seleccionado";

                const orderData = {
                    order_id: Math.floor(10000 + Math.random() * 89999),
                    date: new Date().toLocaleString('es-ES'),
                    patient_name: name,
                    patient_id: document.getElementById('p_id').value || 'Sin ID',
                    graduacion: `OD: ${document.getElementById('od_esf').value || '0'}/${document.getElementById('od_cil').value || '0'}x${document.getElementById('od_eje').value || '0'} (Add ${document.getElementById('od_add').value || '0'}) | OI: ${document.getElementById('oi_esf').value || '0'}/${document.getElementById('oi_cil').value || '0'}x${document.getElementById('oi_eje').value || '0'} (Add ${document.getElementById('oi_add').value || '0'})`,
                    lens_details: document.getElementById('lenses').value,
                    treatments: treatmentVal,
                    frame_details: `${frameVal}: ${document.getElementById('f_details').value || 'S/D'}`,
                    notes: document.getElementById('notes').value || '-',
                    timestamp: serverTimestamp()
                };

                // 1. Guardar en Base de Datos
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'orders'), orderData);

                // 2. Enviar por EmailJS
                await emailjs.send("service_bo6kzuc", "template_4e00pyr", {
                    to_name: "Taller Óptica",
                    from_name: "App Óptica Connect",
                    patient_name: orderData.patient_name,
                    order_id: orderData.order_id,
                    details: `Cristal: ${orderData.lens_details}\nTratamiento: ${orderData.treatments}\nArmazón: ${orderData.frame_details}\nGraduación: ${orderData.graduacion}\nNotas: ${orderData.notes}`
                });

                alert("¡Pedido enviado con éxito!");
                
                // Limpiar formulario y recargar
                document.getElementById('p_name').value = '';
                location.reload();

            } catch (error) {
                console.error("Error al procesar:", error);
                alert("Hubo un error al enviar el pedido. Por favor, verifica tu conexión.");
            } finally {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
            }
        };

        // Cargar Historial
        function loadHistory() {
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'orders'), (snap) => {
                const list = document.getElementById('orders-list');
                const orders = [];
                snap.forEach(doc => orders.push(doc.data()));
                
                // Ordenar por fecha (más reciente primero)
                orders.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

                list.innerHTML = orders.map(o => `
                    <div class="bg-white p-4 rounded-xl border border-slate-100 shadow-sm">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">#${o.order_id || '---'}</span>
                            <span class="text-[10px] font-medium text-slate-400">${o.date}</span>
                        </div>
                        <p class="font-bold text-slate-800 text-sm uppercase">${o.patient_name}</p>
                        <p class="text-[10px] text-slate-500 mb-2">${o.lens_details} + ${o.treatments}</p>
                        <div class="text-[9px] font-mono text-slate-400 bg-slate-50 p-2 rounded leading-tight">
                            ${o.graduacion}
                        </div>
                    </div>
                `).join('');
                
                if (orders.length === 0) {
                    list.innerHTML = `<div class="text-center p-10 text-slate-400 text-xs">No hay pedidos registrados.</div>`;
                }
            }, (error) => {
                console.error("Error en Snapshot:", error);
            });
        }
    </script>
</body>
</html>
