<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óptica Connect | Portal de Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f1f5f9;
        }

        .custom-shadow {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
        }

        .input-group:focus-within label {
            color: #2563eb;
        }

        .select-active {
            background-color: #2563eb !important;
            color: white !important;
            border-color: #2563eb !important;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .loader {
            border-top-color: #2563eb;
            animation: spinner 0.6s linear infinite;
        }

        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 px-4 py-4">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-2 rounded-lg">
                    <i class="fas fa-eye text-white"></i>
                </div>
                <h1 class="font-extrabold text-xl tracking-tight text-slate-800">ÓPTICA<span class="text-blue-600">CONNECT</span></h1>
            </div>
            <div class="flex gap-2 bg-slate-100 p-1 rounded-xl">
                <button onclick="showView('form')" id="tab-form" class="px-4 py-2 rounded-lg text-sm font-bold transition-all bg-white text-blue-600 shadow-sm">NUEVO</button>
                <button onclick="showView('list')" id="tab-list" class="px-4 py-2 rounded-lg text-sm font-bold transition-all text-slate-500">HISTORIAL</button>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto p-4 mt-2">
        
        <!-- VISTA: FORMULARIO DE PEDIDO -->
        <div id="view-form" class="space-y-6">
            
            <!-- Datos del Paciente -->
            <div class="bg-white rounded-2xl p-6 custom-shadow border border-slate-100">
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <i class="fas fa-user-circle text-blue-500"></i> Datos del Paciente
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="input-group">
                        <label class="block text-xs font-bold text-slate-500 mb-1 ml-1">NOMBRE COMPLETO</label>
                        <input type="text" id="patient_name" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl px-4 py-3 outline-none focus:border-blue-500 transition-all" placeholder="Ej: Juan Pérez">
                    </div>
                    <div class="input-group">
                        <label class="block text-xs font-bold text-slate-500 mb-1 ml-1">CONTACTO (WHATSAPP/ID)</label>
                        <input type="text" id="patient_id" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl px-4 py-3 outline-none focus:border-blue-500 transition-all" placeholder="Ej: +54 9 11...">
                    </div>
                </div>
            </div>

            <!-- Receta Técnica -->
            <div class="bg-white rounded-2xl p-6 custom-shadow border border-slate-100">
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <i class="fas fa-file-prescription text-blue-500"></i> Graduación (Receta)
                </h2>
                <div class="space-y-6">
                    <!-- Ojo Derecho -->
                    <div class="bg-blue-50/50 p-4 rounded-xl border border-blue-100">
                        <span class="text-[10px] font-black text-blue-600 uppercase mb-3 block">Ojo Derecho (OD)</span>
                        <div class="grid grid-cols-4 gap-2">
                            <input type="text" id="od_esf" placeholder="ESF" class="bg-white border border-slate-200 rounded-lg p-2 text-center text-sm font-bold">
                            <input type="text" id="od_cil" placeholder="CIL" class="bg-white border border-slate-200 rounded-lg p-2 text-center text-sm font-bold">
                            <input type="text" id="od_eje" placeholder="EJE" class="bg-white border border-slate-200 rounded-lg p-2 text-center text-sm font-bold">
                            <input type="text" id="od_add" placeholder="ADD" class="bg-white border border-slate-200 rounded-lg p-2 text-center text-sm font-bold text-blue-600">
                        </div>
                    </div>
                    <!-- Ojo Izquierdo -->
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <span class="text-[10px] font-black text-slate-500 uppercase mb-3 block">Ojo Izquierdo (OI)</span>
                        <div class="grid grid-cols-4 gap-2">
                            <input type="text" id="oi_esf" placeholder="ESF" class="bg-white border border-slate-200 rounded-lg p-2 text-center text-sm font-bold">
                            <input type="text" id="oi_cil" placeholder="CIL" class="bg-white border border-slate-200 rounded-lg p-2 text-center text-sm font-bold">
                            <input type="text" id="oi_eje" placeholder="EJE" class="bg-white border border-slate-200 rounded-lg p-2 text-center text-sm font-bold">
                            <input type="text" id="oi_add" placeholder="ADD" class="bg-white border border-slate-200 rounded-lg p-2 text-center text-sm font-bold text-blue-600">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cristales y Tratamiento -->
            <div class="bg-white rounded-2xl p-6 custom-shadow border border-slate-100">
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <i class="fas fa-layer-group text-blue-500"></i> Lentes y Tratamientos
                </h2>
                
                <label class="block text-[10px] font-bold text-slate-400 mb-2 uppercase">Tipo de Cristal</label>
                <select id="lens_details" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl px-4 py-3 mb-6 outline-none focus:border-blue-500 font-bold text-slate-700">
                    <option>Monofocal Stock</option>
                    <option>Monofocal Lab</option>
                    <option>Bifocal</option>
                    <option>Multifocal (Progresivo)</option>
                    <option>Ocupacional</option>
                </select>

                <label class="block text-[10px] font-bold text-slate-400 mb-2 uppercase">Tratamientos Seleccionados</label>
                <div class="grid grid-cols-2 gap-2" id="treatments-container">
                    <button type="button" data-val="Sin Tratamiento" class="select-btn select-active border-2 border-slate-100 py-3 rounded-xl text-xs font-bold transition-all uppercase">Sin Tratamiento</button>
                    <button type="button" data-val="Antirreflex" class="select-btn border-2 border-slate-100 py-3 rounded-xl text-xs font-bold transition-all uppercase">Antirreflex</button>
                    <button type="button" data-val="Filtro Azul" class="select-btn border-2 border-slate-100 py-3 rounded-xl text-xs font-bold transition-all uppercase">Filtro Azul</button>
                    <button type="button" data-val="Fotocromático" class="select-btn border-2 border-slate-100 py-3 rounded-xl text-xs font-bold transition-all uppercase">Fotocromático</button>
                </div>
            </div>

            <!-- Armazón -->
            <div class="bg-white rounded-2xl p-6 custom-shadow border border-slate-100">
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <i class="fas fa-glasses text-blue-500"></i> Armazón
                </h2>
                <div class="grid grid-cols-3 gap-2 mb-4" id="frame-type-container">
                    <button type="button" data-val="Zilo" class="frame-btn select-active border-2 border-slate-100 py-3 rounded-xl text-[10px] font-bold uppercase transition-all">ZILO</button>
                    <button type="button" data-val="Metal" class="frame-btn border-2 border-slate-100 py-3 rounded-xl text-[10px] font-bold uppercase transition-all">METAL</button>
                    <button type="button" data-val="Ranura/Aire" class="frame-btn border-2 border-slate-100 py-3 rounded-xl text-[10px] font-bold uppercase transition-all">RANURA</button>
                </div>
                <input type="text" id="frame_details" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl px-4 py-3 outline-none focus:border-blue-500" placeholder="Marca, Modelo, Color...">
            </div>

            <!-- Notas -->
            <div class="bg-white rounded-2xl p-6 custom-shadow border border-slate-100">
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <i class="fas fa-sticky-note text-blue-500"></i> Observaciones Adicionales
                </h2>
                <textarea id="notes" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl px-4 py-3 min-h-[100px] outline-none focus:border-blue-500" placeholder="Instrucciones específicas para el taller..."></textarea>
            </div>

            <!-- Botón Enviar -->
            <button id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-5 rounded-2xl shadow-xl transition-all flex items-center justify-center gap-3 uppercase tracking-tighter text-lg disabled:opacity-50">
                <i class="fas fa-paper-plane"></i> ENVIAR A LABORATORIO
            </button>
        </div>

        <!-- VISTA: HISTORIAL -->
        <div id="view-list" class="hidden space-y-4">
            <div class="flex justify-between items-center px-2">
                <h2 class="text-lg font-black text-slate-800 uppercase italic">Registro de Órdenes</h2>
                <span id="order-count" class="bg-blue-100 text-blue-600 text-[10px] font-black px-2 py-1 rounded-full">0 PEDIDOS</span>
            </div>
            <div id="orders-container" class="space-y-3">
                <!-- Los pedidos se cargan aquí -->
                <div class="p-8 text-center text-slate-400">
                    <i class="fas fa-circle-notch animate-spin text-2xl mb-2"></i>
                    <p class="text-xs font-bold uppercase tracking-widest">Cargando base de datos...</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Overlay de Carga -->
    <div id="global-loader" class="fixed inset-0 bg-white/90 z-[100] hidden items-center justify-center backdrop-blur-sm">
        <div class="text-center">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-12 w-12 mb-4 mx-auto"></div>
            <h2 class="text-slate-800 text-sm font-black uppercase tracking-widest">Transmitiendo pedido...</h2>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuración Firebase (Ambiente Canvas)
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'optica-connect-default';

        // Inicializar EmailJS
        emailjs.init("-NKT0dntx3JOPXYAA");

        // Estado de la aplicación
        let state = {
            treatment: "Sin Tratamiento",
            frameType: "Zilo",
            user: null,
            isSubmitting: false
        };

        // --- LÓGICA DE SELECCIÓN (FIXED) ---
        function setupButtons(containerId, stateKey, btnClass) {
            const container = document.getElementById(containerId);
            const buttons = container.querySelectorAll('.' + btnClass);
            
            buttons.forEach(btn => {
                btn.onclick = (e) => {
                    e.preventDefault();
                    // Remover activo de todos en el grupo
                    buttons.forEach(b => b.classList.remove('select-active'));
                    // Agregar activo al clickeado
                    btn.classList.add('select-active');
                    // Actualizar estado
                    state[stateKey] = btn.getAttribute('data-val');
                };
            });
        }

        setupButtons('treatments-container', 'treatment', 'select-btn');
        setupButtons('frame-type-container', 'frameType', 'frame-btn');

        // --- NAVEGACIÓN ---
        window.showView = (view) => {
            document.getElementById('view-form').classList.toggle('hidden', view !== 'form');
            document.getElementById('view-list').classList.toggle('hidden', view !== 'list');
            
            const tabForm = document.getElementById('tab-form');
            const tabList = document.getElementById('tab-list');
            
            if(view === 'form') {
                tabForm.className = "px-4 py-2 rounded-lg text-sm font-bold transition-all bg-white text-blue-600 shadow-sm";
                tabList.className = "px-4 py-2 rounded-lg text-sm font-bold transition-all text-slate-500";
            } else {
                tabList.className = "px-4 py-2 rounded-lg text-sm font-bold transition-all bg-white text-blue-600 shadow-sm";
                tabForm.className = "px-4 py-2 rounded-lg text-sm font-bold transition-all text-slate-500";
            }
        };

        // --- PROCESAMIENTO DE ENVÍO ---
        const handleSubmit = async () => {
            if (!state.user) {
                alert("Error de conexión: Autenticación no completada.");
                return;
            }

            const pName = document.getElementById('patient_name').value.trim();
            if (!pName) {
                alert("Por favor, ingresa el nombre del paciente.");
                return;
            }

            document.getElementById('global-loader').style.display = 'flex';
            const orderId = Math.floor(1000 + Math.random() * 9000);
            const dateStr = new Date().toLocaleString();

            const graduacionStr = `OD: ESF ${document.getElementById('od_esf').value || '0.00'} CIL ${document.getElementById('od_cil').value || '0.00'} EJE ${document.getElementById('od_eje').value || '0'} ADD ${document.getElementById('od_add').value || '0.00'}\nOI: ESF ${document.getElementById('oi_esf').value || '0.00'} CIL ${document.getElementById('oi_cil').value || '0.00'} EJE ${document.getElementById('oi_eje').value || '0'} ADD ${document.getElementById('oi_add').value || '0.00'}`;

            const payload = {
                order_id: orderId,
                date: dateStr,
                patient_name: pName,
                patient_id: document.getElementById('patient_id').value || "No especificado",
                graduacion: graduacionStr,
                lens_details: document.getElementById('lens_details').value,
                treatments: state.treatment,
                frame_details: `${state.frameType} - ${document.getElementById('frame_details').value || 'Genérico'}`,
                notes: document.getElementById('notes').value || "Sin observaciones adicionales.",
                timestamp: serverTimestamp(),
                userId: state.user.uid
            };

            try {
                // 1. Guardar en Firestore (Regla 1: Ruta específica)
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'orders'), payload);

                // 2. Enviar por EmailJS
                await emailjs.send("service_bo6kzuc", "template_4e00pyr", payload);

                alert("¡Pedido enviado con éxito al laboratorio!");
                location.reload();
            } catch (err) {
                console.error("Error crítico:", err);
                alert("Hubo un problema al procesar el pedido. Revisa la consola.");
                document.getElementById('global-loader').style.display = 'none';
            }
        };

        document.getElementById('submit-btn').onclick = handleSubmit;

        // --- INICIALIZACIÓN Y AUTH (REGLA 3) ---
        const startAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        onAuthStateChanged(auth, (user) => {
            state.user = user;
            if (user) {
                console.log("Sesión activa:", user.uid);
                loadOrders();
            }
        });

        // --- CARGAR HISTORIAL (REGLA 2) ---
        function loadOrders() {
            // Regla 2: Sin queries complejas, traemos todo y ordenamos en JS
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
            
            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('orders-container');
                const countBadge = document.getElementById('order-count');
                
                let docs = [];
                snapshot.forEach(doc => docs.push(doc.data()));

                // Ordenar por fecha (descendente) en memoria
                docs.sort((a, b) => {
                    const tA = a.timestamp?.seconds || 0;
                    const tB = b.timestamp?.seconds || 0;
                    return tB - tA;
                });

                countBadge.innerText = `${docs.length} PEDIDOS`;

                if (docs.length === 0) {
                    container.innerHTML = `<div class="p-12 text-center text-slate-400 font-bold uppercase text-[10px] tracking-widest">No hay pedidos registrados</div>`;
                    return;
                }

                container.innerHTML = docs.map(order => `
                    <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm transition-all hover:border-blue-200">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h3 class="font-black text-slate-800 text-sm uppercase">${order.patient_name}</h3>
                                <p class="text-[10px] font-bold text-slate-400 tracking-wider">ORDEN #${order.order_id} • ${order.date.split(',')[0]}</p>
                            </div>
                            <span class="bg-blue-50 text-blue-600 text-[9px] font-black px-2 py-1 rounded-lg uppercase">${order.lens_details}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mb-3">
                             <div class="bg-slate-50 p-2 rounded-lg text-[9px] text-slate-500 font-mono">
                                <strong>OD:</strong> ${order.graduacion.split('\n')[0].replace('OD: ', '')}
                             </div>
                             <div class="bg-slate-50 p-2 rounded-lg text-[9px] text-slate-500 font-mono">
                                <strong>OI:</strong> ${order.graduacion.split('\n')[1].replace('OI: ', '')}
                             </div>
                        </div>
                        <div class="flex gap-2 items-center">
                            <span class="text-[10px] font-bold text-blue-500 bg-blue-50 px-2 py-0.5 rounded border border-blue-100 italic">
                                ${order.treatments}
                            </span>
                            <span class="text-[10px] font-bold text-slate-500 bg-slate-50 px-2 py-0.5 rounded border border-slate-100">
                                ${order.frame_details.split('-')[0].trim()}
                            </span>
                        </div>
                    </div>
                `).join('');
            }, (error) => {
                console.error("Fallo de lectura Firestore:", error);
            });
        }

        startAuth();
    </script>
</body>
</html>
