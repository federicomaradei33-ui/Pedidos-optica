<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Óptica Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        
        .custom-shadow { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); }
        
        /* Selectores de Radio Estilizados */
        .selector-option input[type="radio"] { display: none; }
        .selector-option label {
            display: flex; align-items: center; justify-content: center;
            padding: 0.75rem 0.5rem; border: 2px solid #e2e8f0; border-radius: 12px;
            cursor: pointer; transition: all 0.2s; font-weight: 600; font-size: 0.75rem;
            background: white; color: #64748b;
        }
        .selector-option input[type="radio"]:checked + label {
            border-color: #2563eb; background-color: #eff6ff; color: #1e40af;
            box-shadow: 0 0 0 1px #2563eb;
        }

        /* Feedback visual */
        .loading-overlay {
            display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.8);
            backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center;
            flex-direction: column;
        }
    </style>
</head>
<body class="pb-10">

    <div id="loader" class="loading-overlay">
        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 font-bold text-blue-800">Enviando pedido...</p>
    </div>

    <!-- Navegación -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 px-4 py-3 custom-shadow">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="font-extrabold text-xl text-slate-800 tracking-tight">ÓPTICA<span class="text-blue-600">CONNECT</span></h1>
            <div class="flex bg-slate-100 p-1 rounded-xl">
                <button onclick="switchView('form')" id="btn-form" class="px-4 py-2 rounded-lg text-xs font-bold transition-all bg-white text-blue-600 shadow-sm">NUEVO</button>
                <button onclick="switchView('list')" id="btn-list" class="px-4 py-2 rounded-lg text-xs font-bold transition-all text-slate-500">LISTADO</button>
            </div>
        </div>
    </nav>

    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- VISTA FORMULARIO -->
        <div id="view-form" class="space-y-4">
            <!-- Paciente -->
            <section class="bg-white p-5 rounded-2xl border border-slate-200 custom-shadow">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Información del Paciente</h3>
                <div class="space-y-3">
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="text" id="paciente_nombre" placeholder="Nombre completo" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-semibold">
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="text" id="paciente_id" placeholder="DNI o Teléfono" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                    </div>
                </div>
            </section>

            <!-- Graduación -->
            <section class="bg-white p-5 rounded-2xl border border-slate-200 custom-shadow">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Graduación</h3>
                <div class="grid grid-cols-5 gap-2 mb-2 text-[9px] font-bold text-center text-slate-400">
                    <div></div><div>ESF</div><div>CIL</div><div>EJE</div><div>ADD</div>
                </div>
                <!-- OD -->
                <div class="grid grid-cols-5 gap-2 items-center mb-3">
                    <span class="text-[10px] font-bold text-blue-600 bg-blue-50 py-2 rounded-lg text-center">OD</span>
                    <input type="text" id="od_esf" placeholder="0.00" class="p-2 bg-slate-50 border border-slate-200 rounded-lg text-center font-bold text-sm outline-none focus:border-blue-400">
                    <input type="text" id="od_cil" placeholder="0.00" class="p-2 bg-slate-50 border border-slate-200 rounded-lg text-center font-bold text-sm outline-none focus:border-blue-400">
                    <input type="text" id="od_eje" placeholder="0°" class="p-2 bg-slate-50 border border-slate-200 rounded-lg text-center font-bold text-sm outline-none focus:border-blue-400">
                    <input type="text" id="od_add" placeholder="0.00" class="p-2 bg-blue-50 border border-blue-200 rounded-lg text-center font-bold text-sm text-blue-700 outline-none">
                </div>
                <!-- OI -->
                <div class="grid grid-cols-5 gap-2 items-center">
                    <span class="text-[10px] font-bold text-slate-600 bg-slate-100 py-2 rounded-lg text-center">OI</span>
                    <input type="text" id="oi_esf" placeholder="0.00" class="p-2 bg-slate-50 border border-slate-200 rounded-lg text-center font-bold text-sm outline-none focus:border-blue-400">
                    <input type="text" id="oi_cil" placeholder="0.00" class="p-2 bg-slate-50 border border-slate-200 rounded-lg text-center font-bold text-sm outline-none focus:border-blue-400">
                    <input type="text" id="oi_eje" placeholder="0°" class="p-2 bg-slate-50 border border-slate-200 rounded-lg text-center font-bold text-sm outline-none focus:border-blue-400">
                    <input type="text" id="oi_add" placeholder="0.00" class="p-2 bg-slate-50 border border-slate-200 rounded-lg text-center font-bold text-sm outline-none">
                </div>
            </section>

            <!-- Tipo de Lente -->
            <section class="bg-white p-5 rounded-2xl border border-slate-200 custom-shadow">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Tipo de Cristal</h3>
                <div class="grid grid-cols-3 gap-2">
                    <div class="selector-option">
                        <input type="radio" name="tipo_lente" id="lente_mono" value="Monofocal" checked>
                        <label for="lente_mono">Monofocal</label>
                    </div>
                    <div class="selector-option">
                        <input type="radio" name="tipo_lente" id="lente_bifo" value="Bifocal">
                        <label for="lente_bifo">Bifocal</label>
                    </div>
                    <div class="selector-option">
                        <input type="radio" name="tipo_lente" id="lente_prog" value="Progresivo">
                        <label for="lente_prog">Progresivo</label>
                    </div>
                </div>
            </section>

            <!-- Tratamiento -->
            <section class="bg-white p-5 rounded-2xl border border-slate-200 custom-shadow">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Tratamiento</h3>
                <div class="grid grid-cols-2 gap-2">
                    <div class="selector-option">
                        <input type="radio" name="tratamiento" id="tr_blanco" value="Blanco" checked>
                        <label for="tr_blanco">Blanco</label>
                    </div>
                    <div class="selector-option">
                        <input type="radio" name="tratamiento" id="tr_ar" value="Antirreflejo">
                        <label for="tr_ar">Antirreflejo</label>
                    </div>
                    <div class="selector-option">
                        <input type="radio" name="tratamiento" id="tr_blue" value="Filtro Azul">
                        <label for="tr_blue">Filtro Azul</label>
                    </div>
                    <div class="selector-option">
                        <input type="radio" name="tratamiento" id="tr_photo" value="Fotocromático">
                        <label for="tr_photo">Fotocromático</label>
                    </div>
                </div>
            </section>

            <!-- Observaciones -->
            <section class="bg-white p-5 rounded-2xl border border-slate-200 custom-shadow">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Observaciones</h3>
                <textarea id="observaciones" rows="3" placeholder="Detalles adicionales..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </section>

            <button onclick="enviarPedido()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-4 rounded-2xl shadow-lg shadow-blue-200 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i>
                ENVIAR PEDIDO
            </button>
        </div>

        <!-- VISTA LISTADO -->
        <div id="view-list" class="hidden space-y-3">
            <h2 class="text-sm font-bold text-slate-500 px-1">Historial de Pedidos</h2>
            <div id="pedidos-container" class="space-y-3">
                <!-- Los pedidos se cargan aquí -->
                <div class="text-center py-10 text-slate-400">
                    <i class="fa-solid fa-spinner animate-spin text-2xl mb-2"></i>
                    <p class="text-xs">Cargando pedidos...</p>
                </div>
            </div>
        </div>

    </main>

    <script>
        // CONFIGURACIÓN FIREBASE
        const firebaseConfig = JSON.parse(__firebase_config);
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'optica-connect-default';

        // Autenticación anónima inmediata
        auth.signInAnonymously().catch(e => console.error("Error Auth:", e));

        // CAMBIO DE VISTA
        function switchView(view) {
            const isForm = view === 'form';
            document.getElementById('view-form').classList.toggle('hidden', !isForm);
            document.getElementById('view-list').classList.toggle('hidden', isForm);
            
            // Estilo botones nav
            const btnForm = document.getElementById('btn-form');
            const btnList = document.getElementById('btn-list');
            
            if(isForm) {
                btnForm.className = "px-4 py-2 rounded-lg text-xs font-bold transition-all bg-white text-blue-600 shadow-sm";
                btnList.className = "px-4 py-2 rounded-lg text-xs font-bold transition-all text-slate-500";
            } else {
                btnList.className = "px-4 py-2 rounded-lg text-xs font-bold transition-all bg-white text-blue-600 shadow-sm";
                btnForm.className = "px-4 py-2 rounded-lg text-xs font-bold transition-all text-slate-500";
                cargarPedidos();
            }
        }

        // FUNCIÓN PRINCIPAL: ENVIAR PEDIDO
        async function enviarPedido() {
            const nombre = document.getElementById('paciente_nombre').value.trim();
            if (!nombre) {
                alert("Por favor, ingresa el nombre del paciente.");
                return;
            }

            const loader = document.getElementById('loader');
            loader.style.display = 'flex';

            try {
                const user = auth.currentUser;
                if (!user) {
                    await auth.signInAnonymously();
                }

                const data = {
                    paciente: nombre,
                    paciente_id: document.getElementById('paciente_id').value,
                    graduacion: {
                        od: { 
                            esf: document.getElementById('od_esf').value, 
                            cil: document.getElementById('od_cil').value, 
                            eje: document.getElementById('od_eje').value,
                            add: document.getElementById('od_add').value
                        },
                        oi: { 
                            esf: document.getElementById('oi_esf').value, 
                            cil: document.getElementById('oi_cil').value, 
                            eje: document.getElementById('oi_eje').value,
                            add: document.getElementById('oi_add').value
                        }
                    },
                    tipo_lente: document.querySelector('input[name="tipo_lente"]:checked').value,
                    tratamiento: document.querySelector('input[name="tratamiento"]:checked').value,
                    observaciones: document.getElementById('observaciones').value,
                    fecha: firebase.firestore.FieldValue.serverTimestamp(),
                    status: 'Pendiente',
                    userId: auth.currentUser.uid
                };

                // Guardar en Firestore usando la ruta obligatoria
                await db.collection('artifacts')
                        .doc(appId)
                        .collection('public')
                        .doc('data')
                        .collection('pedidos')
                        .add(data);

                alert("¡Pedido enviado con éxito!");
                limpiarFormulario();
                switchView('list');

            } catch (error) {
                console.error("Error al enviar:", error);
                alert("Error al enviar el pedido. Por favor, revisa tu conexión.");
            } finally {
                loader.style.display = 'none';
            }
        }

        function limpiarFormulario() {
            document.querySelectorAll('input[type="text"], textarea').forEach(el => el.value = "");
            document.getElementById('lente_mono').checked = true;
            document.getElementById('tr_blanco').checked = true;
        }

        // CARGAR HISTORIAL
        function cargarPedidos() {
            const container = document.getElementById('pedidos-container');
            
            db.collection('artifacts')
              .doc(appId)
              .collection('public')
              .doc('data')
              .collection('pedidos')
              .orderBy('fecha', 'desc')
              .onSnapshot(snapshot => {
                  if (snapshot.empty) {
                      container.innerHTML = '<div class="text-center py-10 text-slate-400 text-xs">No hay pedidos registrados</div>';
                      return;
                  }

                  container.innerHTML = "";
                  snapshot.forEach(doc => {
                      const p = doc.data();
                      const fecha = p.fecha ? new Date(p.fecha.seconds * 1000).toLocaleDateString() : 'Reciente';
                      
                      const card = document.createElement('div');
                      card.className = "bg-white p-4 rounded-xl border border-slate-200 custom-shadow";
                      card.innerHTML = `
                          <div class="flex justify-between items-start mb-2">
                              <div>
                                  <h4 class="font-bold text-slate-800 text-sm">${p.paciente}</h4>
                                  <p class="text-[10px] text-slate-400 font-semibold uppercase">${p.tipo_lente} • ${p.tratamiento}</p>
                              </div>
                              <span class="text-[9px] px-2 py-1 rounded-full font-bold ${p.status === 'Completado' ? 'bg-green-100 text-green-600' : 'bg-amber-100 text-amber-600'}">
                                  ${p.status.toUpperCase()}
                              </span>
                          </div>
                          <div class="grid grid-cols-2 gap-2 text-[10px] text-slate-500 bg-slate-50 p-2 rounded-lg">
                              <div><span class="font-bold">OD:</span> ${p.graduacion.od.esf} | ${p.graduacion.od.cil}</div>
                              <div><span class="font-bold">OI:</span> ${p.graduacion.oi.esf} | ${p.graduacion.oi.cil}</div>
                          </div>
                          <div class="mt-2 flex justify-between items-center text-[9px]">
                              <span class="text-slate-400"><i class="fa-regular fa-calendar mr-1"></i>${fecha}</span>
                              <span class="text-slate-300 font-mono">ID: ${doc.id.substring(0,6)}</span>
                          </div>
                      `;
                      container.appendChild(card);
                  });
              }, err => {
                  console.error("Error historial:", err);
                  container.innerHTML = '<div class="text-center py-10 text-red-400 text-xs">Error al cargar historial</div>';
              });
        }
    </script>
</body>
</html>
