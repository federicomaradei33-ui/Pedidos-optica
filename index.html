<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óptica Connect - Sistema de Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Librerías para PDF y EmailJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        .input-field { @apply w-full px-3 py-2 bg-white border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none text-sm transition-all; }
        .label-text { @apply text-[11px] font-bold text-slate-500 uppercase mb-1 block; }
        
        /* Tabla de graduación compacta y visible */
        .table-grad { width: 100%; border-collapse: collapse; }
        .table-grad th { @apply bg-slate-50 text-[10px] text-slate-400 py-2 border-b; }
        .table-grad td { @apply border-b border-slate-100 p-0; }
        .table-grad input { @apply w-full text-center py-3 border-none focus:ring-0 text-sm; }

        .btn-tab { @apply px-6 py-4 font-bold text-sm transition-all border-b-2; }
        .btn-tab-active { @apply border-blue-600 text-blue-600 bg-blue-50; }
        .btn-tab-inactive { @apply border-transparent text-slate-400 hover:text-slate-600; }

        #login-screen {
            display: flex; align-items: center; justify-content: center;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            z-index: 10000;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen">
        <div class="card p-10 w-full max-w-sm text-center space-y-6">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-blue-600 text-white rounded-2xl shadow-xl mb-2">
                <i class="fas fa-glasses text-4xl"></i>
            </div>
            <div>
                <h2 class="text-2xl font-black text-slate-800">Óptica Connect</h2>
                <p class="text-slate-400 text-sm">Acceso al Laboratorio</p>
            </div>
            <form id="loginForm" class="space-y-4 text-left">
                <div>
                    <label class="label-text">Usuario</label>
                    <input type="text" id="username" class="input-field" placeholder="adminfede" required>
                </div>
                <div>
                    <label class="label-text">Contraseña</label>
                    <input type="password" id="password" class="input-field" placeholder="****" required>
                </div>
                <button type="submit" class="w-full py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 shadow-lg active:scale-95 transition-all">
                    ENTRAR
                </button>
            </form>
            <p id="login-err" class="text-red-500 text-xs hidden">Credenciales inválidas. Intente de nuevo.</p>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="app-main" class="hidden">
        <nav class="bg-white border-b sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-6 flex justify-between items-center h-16">
                <div class="flex items-center gap-2">
                    <i class="fas fa-eye text-blue-600 text-2xl"></i>
                    <span class="font-black text-xl tracking-tight">ÓPTICA<span class="text-blue-600">CONNECT</span></span>
                </div>
                <div class="flex items-center">
                    <button onclick="changeTab('new')" id="tab-new" class="btn-tab btn-tab-active">NUEVA ORDEN</button>
                    <button onclick="changeTab('history')" id="tab-history" class="btn-tab btn-tab-inactive">HISTORIAL</button>
                    <button onclick="logout()" class="ml-6 text-slate-400 hover:text-red-600 text-xs font-bold transition-colors">
                        <i class="fas fa-power-off"></i> SALIR
                    </button>
                </div>
            </div>
        </nav>

        <main class="max-w-6xl mx-auto p-6">
            
            <!-- VISTA: FORMULARIO -->
            <div id="view-new" class="space-y-6">
                <div class="flex justify-between items-end">
                    <h2 class="text-2xl font-bold">Nueva Orden de Trabajo</h2>
                    <div class="bg-blue-100 text-blue-700 px-4 py-1 rounded-full font-mono font-bold text-sm">
                        PEDIDO # <span id="order-number">---</span>
                    </div>
                </div>

                <form id="orderForm" class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <!-- Columna Izquierda (8/12) -->
                    <div class="lg:col-span-8 space-y-6">
                        <!-- Paciente -->
                        <div class="card p-6">
                            <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2"><i class="fas fa-user text-blue-500"></i> DATOS DEL PACIENTE</h3>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div class="md:col-span-1">
                                    <label class="label-text">Nombre y Apellido</label>
                                    <input type="text" id="p_name" required class="input-field" placeholder="Nombre completo">
                                </div>
                                <div>
                                    <label class="label-text">DNI</label>
                                    <input type="text" id="p_dni" class="input-field" placeholder="Documento">
                                </div>
                                <div>
                                    <label class="label-text">Teléfono</label>
                                    <input type="text" id="p_tel" class="input-field" placeholder="Contacto">
                                </div>
                            </div>
                        </div>

                        <!-- Receta Médica Completa -->
                        <div class="card p-6 overflow-hidden">
                            <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2"><i class="fas fa-file-medical text-blue-500"></i> RECETA TÉCNICA</h3>
                            <div class="border rounded-lg overflow-hidden mb-4">
                                <table class="table-grad">
                                    <thead>
                                        <tr>
                                            <th class="w-16 border-r">OJO</th>
                                            <th>ESFÉRICOS</th>
                                            <th>CILÍNDRICOS</th>
                                            <th>EJE (°)</th>
                                            <th>ADICIÓN</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td class="bg-slate-50 text-center font-bold text-blue-600 border-r">OD</td>
                                            <td><input type="text" id="od_esf" placeholder="0.00"></td>
                                            <td><input type="text" id="od_cil" placeholder="0.00"></td>
                                            <td><input type="text" id="od_eje" placeholder="0"></td>
                                            <td><input type="text" id="od_add" placeholder="0.00"></td>
                                        </tr>
                                        <tr>
                                            <td class="bg-slate-50 text-center font-bold text-blue-600 border-r">OI</td>
                                            <td><input type="text" id="oi_esf" placeholder="0.00"></td>
                                            <td><input type="text" id="oi_cil" placeholder="0.00"></td>
                                            <td><input type="text" id="oi_eje" placeholder="0"></td>
                                            <td><input type="text" id="oi_add" placeholder="0.00"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="label-text">DNP (Nasopupilar)</label>
                                    <input type="text" id="dnp" class="input-field text-center" placeholder="Ej: 32/33">
                                </div>
                                <div>
                                    <label class="label-text">Altura / Calibre</label>
                                    <input type="text" id="altura" class="input-field text-center" placeholder="Ej: 18mm">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Columna Derecha (4/12) -->
                    <div class="lg:col-span-4 space-y-6">
                        <!-- Cristales -->
                        <div class="card p-6">
                            <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2"><i class="fas fa-layer-group text-blue-500"></i> CRISTALES</h3>
                            <label class="label-text">Tipo de Lente</label>
                            <select id="lens_type" class="input-field mb-4">
                                <option>Monofocal Stock</option>
                                <option>Monofocal Laboratorio</option>
                                <option>Bifocal</option>
                                <option>Multifocal / Progresivo</option>
                                <option>Ocupacional</option>
                            </select>
                            <div class="grid grid-cols-2 gap-2">
                                <label class="flex items-center gap-2 p-2 border rounded text-[10px] font-bold cursor-pointer hover:bg-slate-50">
                                    <input type="checkbox" name="treat" value="Antirreflex"> ANTIRREFLEX
                                </label>
                                <label class="flex items-center gap-2 p-2 border rounded text-[10px] font-bold cursor-pointer hover:bg-slate-50">
                                    <input type="checkbox" name="treat" value="Filtro Azul"> FILTRO AZUL
                                </label>
                                <label class="flex items-center gap-2 p-2 border rounded text-[10px] font-bold cursor-pointer hover:bg-slate-50">
                                    <input type="checkbox" name="treat" value="Fotocromático"> FOTOCROMÁTICO
                                </label>
                                <label class="flex items-center gap-2 p-2 border rounded text-[10px] font-bold cursor-pointer hover:bg-slate-50">
                                    <input type="checkbox" name="treat" value="Sin Tratamiento"> NINGUNO
                                </label>
                            </div>
                        </div>

                        <!-- Armazón -->
                        <div class="card p-6">
                            <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2"><i class="fas fa-glasses text-blue-500"></i> ARMAZÓN</h3>
                            <div class="space-y-4">
                                <div>
                                    <label class="label-text">Material del Armazón</label>
                                    <select id="frame_material" class="input-field">
                                        <option value="ZILO">ZILO</option>
                                        <option value="METAL">METAL</option>
                                        <option value="RANURADO">RANURADO</option>
                                        <option value="AL AIRE">AL AIRE</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="label-text">Marca / Modelo / Color</label>
                                    <input type="text" id="frame_model" class="input-field" placeholder="Ej: Ray-Ban 5228 Black">
                                </div>
                                <div>
                                    <label class="label-text">Observaciones de taller</label>
                                    <textarea id="notes" class="input-field h-20 resize-none" placeholder="Instrucciones adicionales..."></textarea>
                                </div>
                            </div>
                        </div>

                        <button type="submit" id="submitBtn" class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold shadow-xl hover:bg-blue-700 transition-all flex items-center justify-center gap-2">
                            FINALIZAR Y ENVIAR <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </form>
            </div>

            <!-- VISTA: HISTORIAL -->
            <div id="view-history" class="hidden space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-bold">Historial de Pedidos</h2>
                    <button onclick="clearHistory()" class="text-xs text-red-500 font-bold hover:underline uppercase">Borrar todo</button>
                </div>
                <div id="history-container" class="space-y-4">
                    <!-- Dinámico -->
                </div>
            </div>

        </main>
    </div>

    <script>
        // --- CONFIGURACIÓN EMAILJS (Basada en tus imágenes) ---
        (function() {
            emailjs.init("-NKT0dntx3JOPXYAA"); // Tu Clave Pública de la imagen
        })();

        // --- ESTADO Y VARIABLES ---
        let orders = JSON.parse(localStorage.getItem('optica_orders_fede')) || [];
        const loginScreen = document.getElementById('login-screen');
        const appMain = document.getElementById('app-main');

        // --- LÓGICA DE INICIO DE SESIÓN ---
        document.getElementById('loginForm').onsubmit = (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            
            // Credenciales según tu imagen "adminfede"
            if (u === 'adminfede' && p === '1234') {
                sessionStorage.setItem('isLogged', 'true');
                showApp();
            } else {
                document.getElementById('login-err').classList.remove('hidden');
            }
        };

        function showApp() {
            loginScreen.style.display = 'none';
            appMain.classList.remove('hidden');
            generateID();
            renderHistory();
        }

        if (sessionStorage.getItem('isLogged') === 'true') showApp();

        function logout() {
            sessionStorage.removeItem('isLogged');
            location.reload();
        }

        // --- MANEJO DE VISTAS ---
        function changeTab(tab) {
            document.getElementById('view-new').classList.toggle('hidden', tab !== 'new');
            document.getElementById('view-history').classList.toggle('hidden', tab !== 'history');
            document.getElementById('tab-new').className = `btn-tab ${tab === 'new' ? 'btn-tab-active' : 'btn-tab-inactive'}`;
            document.getElementById('tab-history').className = `btn-tab ${tab === 'history' ? 'btn-tab-active' : 'btn-tab-inactive'}`;
        }

        function generateID() {
            const id = Math.floor(10000 + Math.random() * 90000);
            document.getElementById('order-number').innerText = id;
        }

        // --- ENVÍO DE ORDEN ---
        document.getElementById('orderForm').onsubmit = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ENVIANDO...`;

            const selectedTreats = Array.from(document.querySelectorAll('input[name="treat"]:checked')).map(cb => cb.value);
            const orderID = document.getElementById('order-number').innerText;

            const orderData = {
                order_id: orderID,
                date: new Date().toLocaleString(),
                patient_name: document.getElementById('p_name').value,
                patient_id: document.getElementById('p_dni').value || "No especificado",
                graduacion: `OD: ${document.getElementById('od_esf').value}/${document.getElementById('od_cil').value}x${document.getElementById('od_eje').value} (Add ${document.getElementById('od_add').value}) | OI: ${document.getElementById('oi_esf').value}/${document.getElementById('oi_cil').value}x${document.getElementById('oi_eje').value} (Add ${document.getElementById('oi_add').value}) | DNP: ${document.getElementById('dnp').value} | Alt: ${document.getElementById('altura').value}`,
                lens_details: document.getElementById('lens_type').value,
                treatments: selectedTreats.join(', ') || 'Sin tratamientos',
                frame_details: `${document.getElementById('frame_material').value} - ${document.getElementById('frame_model').value}`,
                notes: document.getElementById('notes').value || 'Sin observaciones'
            };

            // Enviar vía EmailJS
            try {
                await emailjs.send("service_bo6kzuc", "template_4e00pyr", orderData);
                
                // Guardar en local
                orders.unshift(orderData);
                localStorage.setItem('optica_orders_fede', JSON.stringify(orders));
                
                alert("✅ ORDEN ENVIADA AL LABORATORIO Y GUARDADA.");
                
                this.reset();
                generateID();
                renderHistory();
                changeTab('history');
            } catch (err) {
                console.error(err);
                alert("Error al enviar el mail. El pedido se guardó localmente.");
                orders.unshift(orderData);
                localStorage.setItem('optica_orders_fede', JSON.stringify(orders));
                renderHistory();
            } finally {
                btn.disabled = false;
                btn.innerHTML = `FINALIZAR Y ENVIAR <i class="fas fa-paper-plane"></i>`;
            }
        };

        // --- RENDERIZADO DE HISTORIAL COMPLETO ---
        function renderHistory() {
            const container = document.getElementById('history-container');
            if (orders.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-slate-400 italic">No hay pedidos en el historial.</div>`;
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="card p-6 border-l-4 border-l-blue-600 hover:shadow-lg transition-shadow">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="text-blue-600 font-mono font-black text-lg">#${order.order_id}</span>
                            <h4 class="text-xl font-black text-slate-800 uppercase">${order.patient_name}</h4>
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">${order.date}</p>
                        </div>
                        <div class="text-right">
                            <span class="bg-slate-100 px-3 py-1 rounded text-[10px] font-black text-slate-600 uppercase">Enviado por Mail</span>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 bg-slate-50 p-5 rounded-xl border">
                        <div class="space-y-1">
                            <p class="label-text text-blue-600 border-b pb-1">Graduación Técnica</p>
                            <p class="text-xs leading-relaxed font-medium">${order.graduacion.split('|').join('<br>')}</p>
                        </div>
                        <div class="space-y-1">
                            <p class="label-text text-blue-600 border-b pb-1">Cristales</p>
                            <p class="text-xs"><strong>TIPO:</strong> ${order.lens_details}</p>
                            <p class="text-xs"><strong>TRATAMIENTO:</strong> ${order.treatments}</p>
                        </div>
                        <div class="space-y-1">
                            <p class="label-text text-blue-600 border-b pb-1">Armazón y Taller</p>
                            <p class="text-xs font-bold">${order.frame_details}</p>
                            <p class="text-[11px] italic text-slate-500 mt-2 bg-white p-2 rounded border border-dashed">"${order.notes}"</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function clearHistory() {
            if (confirm("¿Seguro que deseas eliminar todos los registros locales?")) {
                localStorage.removeItem('optica_orders_fede');
                orders = [];
                renderHistory();
            }
        }
    </script>
</body>
</html>
