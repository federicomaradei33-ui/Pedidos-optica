<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Óptica Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; }
        .card-anim { transition: transform 0.2s; }
        .card-anim:hover { transform: translateY(-4px); }
        #loading-overlay { background: rgba(255, 255, 255, 0.9); }
    </style>
</head>
<body>

    <!-- Pantalla de Carga Inicial -->
    <div id="loading-overlay" class="fixed inset-0 z-[100] flex flex-col items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
        <p class="text-gray-600 font-medium">Sincronizando con la nube...</p>
    </div>

    <div id="main-app">
        <nav class="bg-blue-700 text-white shadow-lg p-4 sticky top-0 z-40">
            <div class="max-w-6xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fas fa-glasses text-2xl"></i>
                    <span class="font-bold text-xl tracking-tight">ÓPTICA CLOUD</span>
                </div>
                <div class="flex items-center gap-4">
                    <span id="status-cloud" class="text-xs bg-blue-800 px-3 py-1 rounded-full flex items-center gap-2">
                        <span class="h-2 w-2 bg-green-400 rounded-full animate-pulse"></span> Online
                    </span>
                    <button onclick="abrirModal()" class="bg-white text-blue-700 hover:bg-blue-50 px-5 py-2 rounded-lg font-bold transition-all shadow-md">
                        + Nueva Orden
                    </button>
                </div>
            </div>
        </nav>

        <main class="max-w-6xl mx-auto p-4 md:p-6">
            <div id="contenedor-ordenes" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Las órdenes se cargarán aquí desde Firestore -->
            </div>
        </main>
    </div>

    <!-- Modal para Nueva Orden -->
    <div id="modal-orden" class="fixed inset-0 bg-slate-900/70 hidden flex items-center justify-center z-[60] p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl animate-in fade-in zoom-in duration-200">
            <div class="bg-blue-600 p-5 text-white flex justify-between items-center">
                <h2 class="text-lg font-bold">Nuevo Registro de Trabajo</h2>
                <button onclick="cerrarModal()" class="text-2xl hover:text-gray-200">&times;</button>
            </div>
            <form id="form-orden" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nombre del Cliente</label>
                    <input type="text" id="cliente" required class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Armazón</label>
                        <input type="text" id="armazon" required class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Marca/Color">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Graduación</label>
                        <input type="text" id="graduacion" required class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ej: +1.50">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Laboratorio</label>
                    <input type="text" id="lab" required class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="pt-2">
                    <button type="submit" id="btn-submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 shadow-lg transition-all flex items-center justify-center gap-2">
                        <i class="fas fa-save"></i> GUARDAR EN LA NUBE
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'optica-manager-v2';

        let currentUser = null;

        // Autenticación automática silenciosa
        async function initApp() {
            try {
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        document.getElementById('loading-overlay').classList.add('hidden');
                        startListening();
                    }
                });
            } catch (error) {
                console.error("Error de conexión:", error);
                document.getElementById('loading-overlay').innerHTML = `
                    <div class="text-center p-6">
                        <i class="fas fa-exclamation-triangle text-red-500 text-4xl mb-4"></i>
                        <p class="font-bold text-gray-800">Error de conexión</p>
                        <p class="text-gray-500">Verifica tu internet y recarga la página.</p>
                    </div>
                `;
            }
        }

        // Escuchar cambios en tiempo real desde Firestore
        function startListening() {
            // Regla 1: Usamos la ruta pública para que todos los dispositivos vean lo mismo
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'ordenes');
            
            // Regla 2: Consulta simple (sin orderBy complejo para evitar errores de índice)
            onSnapshot(colRef, (snapshot) => {
                const ordenes = [];
                snapshot.forEach(doc => {
                    ordenes.push({ id: doc.id, ...doc.data() });
                });
                // Ordenamos localmente por fecha (descendente)
                ordenes.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                renderizarOrdenes(ordenes);
            }, (error) => {
                console.error("Error cargando datos:", error);
            });
        }

        function renderizarOrdenes(ordenes) {
            const contenedor = document.getElementById('contenedor-ordenes');
            if (ordenes.length === 0) {
                contenedor.innerHTML = `
                    <div class="col-span-full text-center py-20">
                        <i class="fas fa-folder-open text-gray-200 text-6xl mb-4"></i>
                        <p class="text-gray-400">No hay trabajos registrados. Empieza creando uno nuevo.</p>
                    </div>
                `;
                return;
            }

            contenedor.innerHTML = ordenes.map(o => `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 card-anim relative group">
                    <button onclick="window.eliminarOrden('${o.id}')" class="absolute top-4 right-4 text-gray-300 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                    <div class="flex items-center gap-4 mb-5">
                        <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center font-bold text-lg shadow-inner">
                            ${o.cliente.charAt(0).toUpperCase()}
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-800 leading-tight">${o.cliente}</h3>
                            <p class="text-xs text-blue-500 font-medium uppercase tracking-wider">${o.lab}</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded-xl">
                        <div>
                            <p class="text-[10px] text-gray-400 font-bold uppercase">Armazón</p>
                            <p class="text-sm font-semibold text-gray-700 truncate">${o.armazon}</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-gray-400 font-bold uppercase">Graduación</p>
                            <p class="text-sm font-bold text-blue-700">${o.graduacion}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Exponer funciones al window para el HTML
        window.abrirModal = () => document.getElementById('modal-orden').classList.remove('hidden');
        window.cerrarModal = () => document.getElementById('modal-orden').classList.add('hidden');

        window.eliminarOrden = async (id) => {
            if (!confirm('¿Eliminar este registro permanentemente?')) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'ordenes', id);
                await deleteDoc(docRef);
            } catch (e) {
                console.error("Error al borrar:", e);
            }
        };

        // Manejo del Formulario
        document.getElementById('form-orden').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch animate-spin"></i> Guardando...';

            const data = {
                cliente: document.getElementById('cliente').value,
                armazon: document.getElementById('armazon').value,
                graduacion: document.getElementById('graduacion').value,
                lab: document.getElementById('lab').value,
                createdAt: serverTimestamp()
            };

            try {
                if (!currentUser) throw new Error("No autenticado");
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'ordenes');
                await addDoc(colRef, data);
                
                window.cerrarModal();
                document.getElementById('form-orden').reset();
            } catch (error) {
                console.error("Error al guardar:", error);
                alert("Error al conectar con la nube. Intenta de nuevo.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> GUARDAR EN LA NUBE';
            }
        });

        initApp();
    </script>
</body>
