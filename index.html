<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÓpticaConnect - Gestión de Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        
        .glass-card {
            background: white;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            padding: 1.5rem;
        }

        .input-field {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 0.75rem;
            width: 100%;
            transition: all 0.2s;
        }

        .select-btn {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 0.75rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #64748b;
        }

        .select-btn.active {
            background: #2563eb !important;
            border-color: #1e40af !important;
            color: white !important;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .tab-btn {
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
            font-weight: 700;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #eff6ff;
            color: #2563eb;
        }
    </style>
</head>
<body>

    <div id="loader" class="loading-overlay">
        <div class="flex flex-col items-center">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent"></div>
            <p class="mt-4 font-bold text-blue-800 uppercase tracking-widest">Enviando pedido...</p>
        </div>
    </div>

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fas fa-glasses text-blue-600 text-2xl"></i>
                <span class="font-extrabold text-xl tracking-tight text-slate-800 uppercase">Óptica<span class="text-blue-600">Connect</span></span>
            </div>
            <nav class="flex items-center gap-2">
                <button onclick="switchTab('nueva')" id="btn-nueva" class="tab-btn active text-sm">NUEVA</button>
                <button onclick="switchTab('historial')" id="btn-historial" class="tab-btn text-slate-500 text-sm">HISTORIAL</button>
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-6">
        
        <div id="view-nueva" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="lg:col-span-2 space-y-6">
                <section class="glass-card">
                    <h2 class="font-bold text-slate-700 uppercase text-xs tracking-wider mb-4">Datos del Paciente</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="p_nombre" class="input-field" placeholder="Nombre Completo">
                        <input type="text" id="p_tel" class="input-field" placeholder="WhatsApp / Teléfono">
                    </div>
                </section>

                <section class="glass-card">
                    <h2 class="font-bold text-slate-700 uppercase text-xs tracking-wider mb-4">Receta</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="text-slate-400 text-[10px] uppercase">
                                    <th class="text-left pb-2">Ojo</th>
                                    <th class="pb-2">Esf</th>
                                    <th class="pb-2">Cil</th>
                                    <th class="pb-2">Eje</th>
                                    <th class="pb-2">Adi</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="border-b border-slate-50">
                                    <td class="py-3 font-bold text-blue-700">OD</td>
                                    <td><input type="text" id="od_esf" value="0.00" class="w-full text-center outline-none"></td>
                                    <td><input type="text" id="od_cil" value="0.00" class="w-full text-center outline-none"></td>
                                    <td><input type="text" id="od_eje" value="0" class="w-full text-center outline-none"></td>
                                    <td><input type="text" id="od_adi" value="+0.00" class="w-full text-center outline-none font-bold text-blue-600"></td>
                                </tr>
                                <tr>
                                    <td class="py-3 font-bold text-blue-700">OI</td>
                                    <td><input type="text" id="oi_esf" value="0.00" class="w-full text-center outline-none"></td>
                                    <td><input type="text" id="oi_cil" value="0.00" class="w-full text-center outline-none"></td>
                                    <td><input type="text" id="oi_eje" value="0" class="w-full text-center outline-none"></td>
                                    <td><input type="text" id="oi_adi" value="+0.00" class="w-full text-center outline-none font-bold text-blue-600"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <section class="glass-card">
                    <h2 class="font-bold text-slate-700 uppercase text-xs tracking-wider mb-4">Armazón</h2>
                    <div class="grid grid-cols-3 gap-3 mb-4">
                        <button type="button" onclick="setArmazon('Zilo', this)" class="select-btn armazon-opt active">ZILO</button>
                        <button type="button" onclick="setArmazon('Metal', this)" class="select-btn armazon-opt">METAL</button>
                        <button type="button" onclick="setArmazon('Ranura', this)" class="select-btn armazon-opt">RANURA</button>
                    </div>
                    <input type="text" id="armazon_detalle" class="input-field" placeholder="Detalles (Marca, Color, etc.)">
                </section>
            </div>

            <div class="space-y-6">
                <section class="glass-card">
                    <h2 class="font-bold text-slate-700 uppercase text-xs tracking-wider mb-4">Cristal y Tratamiento</h2>
                    <select id="tipo_cristal" class="input-field mb-4">
                        <option>Monofocal Stock</option>
                        <option>Monofocal Lab</option>
                        <option>Bifocal</option>
                        <option>Multifocal</option>
                    </select>

                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Seleccione una opción:</label>
                        <button type="button" onclick="setTratamiento('Sin Tratamiento', this)" class="select-btn treat-opt active w-full">SIN TRATAMIENTO</button>
                        <button type="button" onclick="setTratamiento('Antirreflex', this)" class="select-btn treat-opt w-full">ANTIRREFLEX</button>
                        <button type="button" onclick="setTratamiento('Filtro Azul', this)" class="select-btn treat-opt w-full">FILTRO AZUL</button>
                        <button type="button" onclick="setTratamiento('Fotocromático', this)" class="select-btn treat-opt w-full">FOTOCROMÁTICO</button>
                    </div>
                </section>

                <button onclick="procesarPedido()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl transition-all shadow-lg shadow-blue-100">
                    ENVIAR PEDIDO
                </button>
            </div>
        </div>

        <div id="view-historial" class="hidden space-y-4">
            <h2 class="text-xl font-black text-slate-800 mb-4">HISTORIAL</h2>
            <div id="lista-pedidos" class="grid gap-4"></div>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'optica-connect-v4';

        emailjs.init("-NKT0dntx3JOPXYAA");

        let state = {
            armazon: 'Zilo',
            tratamiento: 'Sin Tratamiento',
            user: null
        };

        window.setArmazon = (val, el) => {
            document.querySelectorAll('.armazon-opt').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            state.armazon = val;
        };

        window.setTratamiento = (val, el) => {
            document.querySelectorAll('.treat-opt').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            state.tratamiento = val;
        };

        window.switchTab = (tab) => {
            document.getElementById('view-nueva').classList.toggle('hidden', tab !== 'nueva');
            document.getElementById('view-historial').classList.toggle('hidden', tab !== 'historial');
            document.getElementById('btn-nueva').className = `tab-btn ${tab === 'nueva' ? 'active' : 'text-slate-500'}`;
            document.getElementById('btn-historial').className = `tab-btn ${tab === 'historial' ? 'active' : 'text-slate-500'}`;
        };

        signInAnonymously(auth).then(() => {
            onAuthStateChanged(auth, (user) => {
                if (user) { 
                    state.user = user.uid;
                    conectar();
                }
            });
        });

        window.procesarPedido = async () => {
            const nombre = document.getElementById('p_nombre').value.trim();
            if (!nombre) return alert("Falta nombre del paciente");

            document.getElementById('loader').style.display = 'flex';

            const data = {
                paciente: nombre,
                whatsapp: document.getElementById('p_tel').value,
                cristal: document.getElementById('tipo_cristal').value,
                armazon: state.armazon,
                detalle: document.getElementById('armazon_detalle').value,
                tratamiento: state.tratamiento,
                receta: `OD: ${document.getElementById('od_esf').value}/${document.getElementById('od_cil').value} | OI: ${document.getElementById('oi_esf').value}/${document.getElementById('oi_cil').value}`,
                timestamp: serverTimestamp()
            };

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'pedidos'), data);
                await emailjs.send("service_bo6kzuc", "template_4e00pyr", {
                    paciente: data.paciente,
                    cristal: data.cristal,
                    tratamientos: data.tratamiento,
                    armazon: data.armazon + " " + data.detalle,
                    receta_od: data.receta
                });
                location.reload();
            } catch (e) {
                alert("Error");
                document.getElementById('loader').style.display = 'none';
            }
        };

        function conectar() {
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'pedidos'), (snap) => {
                const list = document.getElementById('lista-pedidos');
                list.innerHTML = "";
                let docs = [];
                snap.forEach(d => docs.push(d.data()));
                docs.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                
                docs.forEach(p => {
                    const div = document.createElement('div');
                    div.className = "glass-card";
                    div.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-blue-700">${p.paciente}</h3>
                                <p class="text-xs text-slate-500">${p.cristal} - <span class="text-blue-600 font-bold">${p.tratamiento}</span></p>
                                <p class="text-[10px] mt-2 font-mono">${p.receta}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-[10px] bg-slate-100 px-2 py-1 rounded font-bold">${p.armazon}</span>
                            </div>
                        </div>
                    `;
                    list.appendChild(div);
                });
            });
        }
    </script>
</body>
</html>
