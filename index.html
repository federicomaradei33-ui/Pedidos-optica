<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óptica Connect - SISTEMA DE EMERGENCIA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card { background: white; border-radius: 16px; box-shadow: 0 4px 20px -5px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .input-field { @apply w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none text-sm transition-all; }
        .label-text { @apply text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 block ml-1; }
        .btn-primary { @apply bg-blue-600 text-white py-4 px-6 rounded-2xl font-bold hover:bg-blue-700 transition-all flex items-center justify-center gap-3 shadow-lg shadow-blue-200 active:scale-95; }
        
        #auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); }
        #app-content { display: none; }
        
        .grad-table input { @apply w-full text-center bg-transparent border-none focus:ring-0 text-sm font-bold p-2; }
        .status-pill { @apply px-2 py-1 rounded-full text-[9px] font-black uppercase; }
        
        @keyframes pulse-blue { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .loading-dot { animation: pulse-blue 1.5s infinite; }
    </style>
</head>
<body>

    <!-- PANTALLA DE ACCESO (MODAL PRIORITARIO) -->
    <div id="auth-screen">
        <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md border border-white">
            <div class="text-center mb-10">
                <div class="w-20 h-20 bg-blue-600 text-white rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-2xl rotate-3 transform transition hover:rotate-0">
                    <i class="fas fa-glasses text-4xl"></i>
                </div>
                <h1 class="text-3xl font-black text-slate-800 tracking-tighter">ÓPTICA CONNECT</h1>
                <div class="flex items-center justify-center gap-2 mt-2">
                    <span class="h-2 w-2 rounded-full bg-green-500 loading-dot"></span>
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-tighter">Sistema Operativo</p>
                </div>
            </div>

            <div class="space-y-5" id="login-form">
                <div>
                    <label class="label-text">Nombre de la Óptica</label>
                    <input type="text" id="username" class="input-field" placeholder="Ej: Óptica Central">
                </div>
                
                <button onclick="fastLogin()" class="w-full btn-primary mt-4">
                    <span>ACCEDER AHORA</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
                
                <p class="text-[10px] text-center text-slate-400 font-medium px-6">
                    Acceso instantáneo habilitado para evitar errores de conexión con el servidor.
                </p>
            </div>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL -->
    <div id="app-content">
        <header class="bg-white/80 backdrop-blur-md border-b sticky top-0 z-50">
            <div class="max-w-5xl mx-auto px-6 h-20 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-blue-600 rounded-lg text-white">
                        <i class="fas fa-bolt text-sm"></i>
                    </div>
                    <span class="font-black text-xl text-slate-800 tracking-tighter">CONECTA<span class="text-blue-600">LAB</span></span>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="nav('new')" class="nav-btn active px-4 py-2 text-sm font-bold text-blue-600 bg-blue-50 rounded-xl" id="btn-new">Nueva Orden</button>
                    <button onclick="nav('history')" class="nav-btn px-4 py-2 text-sm font-bold text-slate-500" id="btn-history">Historial</button>
                    <div class="h-8 w-[1px] bg-slate-200 mx-2"></div>
                    <button onclick="location.reload()" class="h-10 w-10 flex items-center justify-center rounded-xl text-slate-400 hover:bg-red-50 hover:text-red-500 transition-all">
                        <i class="fas fa-power-off"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-5xl mx-auto p-6">
            <div id="view-new" class="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-700">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 class="text-3xl font-black text-slate-800">Orden de Trabajo</h2>
                        <p id="welcome-msg" class="text-slate-500 font-medium"></p>
                    </div>
                    <div class="bg-white px-4 py-2 rounded-2xl border shadow-sm text-center">
                        <span class="label-text !mb-0">ID Pedido</span>
                        <span id="order-id" class="text-lg font-black text-blue-600 tracking-widest">---</span>
                    </div>
                </div>

                <form id="orderForm" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- COLUMNA IZQUIERDA: DATOS Y GRADUACIÓN -->
                    <div class="lg:col-span-2 space-y-6">
                        <div class="card p-8">
                            <div class="flex items-center gap-3 mb-6">
                                <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs">1</div>
                                <h3 class="font-black text-slate-700 uppercase tracking-tight">Datos del Paciente</h3>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="md:col-span-1">
                                    <label class="label-text">Nombre del Paciente</label>
                                    <input type="text" id="p_name" class="input-field" required placeholder="Juan Pérez">
                                </div>
                                <div>
                                    <label class="label-text">Teléfono / Referencia</label>
                                    <input type="text" id="p_contact" class="input-field" placeholder="Ej: 11 2233-4455">
                                </div>
                            </div>
                        </div>

                        <div class="card p-8">
                            <div class="flex items-center gap-3 mb-6">
                                <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs">2</div>
                                <h3 class="font-black text-slate-700 uppercase tracking-tight">Graduación</h3>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full border-separate border-spacing-0 rounded-2xl border overflow-hidden">
                                    <thead class="bg-slate-50 text-[10px] uppercase font-black text-slate-400">
                                        <tr>
                                            <th class="p-4 text-left border-b">Ojo</th>
                                            <th class="p-4 border-b border-l">Esférico</th>
                                            <th class="p-4 border-b border-l">Cilíndrico</th>
                                            <th class="p-4 border-b border-l">Eje</th>
                                            <th class="p-4 border-b border-l">Adición</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y text-slate-700">
                                        <tr>
                                            <td class="p-4 bg-blue-50/50 font-black text-blue-600">O.D.</td>
                                            <td class="border-l"><input type="text" id="od_esf" class="grad-table input" placeholder="0.00"></td>
                                            <td class="border-l"><input type="text" id="od_cil" class="grad-table input" placeholder="0.00"></td>
                                            <td class="border-l"><input type="text" id="od_eje" class="grad-table input" placeholder="0°"></td>
                                            <td class="border-l"><input type="text" id="od_add" class="grad-table input" placeholder="0.00"></td>
                                        </tr>
                                        <tr>
                                            <td class="p-4 bg-blue-50/50 font-black text-blue-600">O.I.</td>
                                            <td class="border-l"><input type="text" id="oi_esf" class="grad-table input" placeholder="0.00"></td>
                                            <td class="border-l"><input type="text" id="oi_cil" class="grad-table input" placeholder="0.00"></td>
                                            <td class="border-l"><input type="text" id="oi_eje" class="grad-table input" placeholder="0°"></td>
                                            <td class="border-l"><input type="text" id="oi_add" class="grad-table input" placeholder="0.00"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="grid grid-cols-2 gap-4 mt-6">
                                <div>
                                    <label class="label-text">D.N.P. (mm)</label>
                                    <input type="text" id="dnp" class="input-field" placeholder="Distancia pupilar">
                                </div>
                                <div>
                                    <label class="label-text">Altura (mm)</label>
                                    <input type="text" id="altura" class="input-field" placeholder="Altura de montaje">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- COLUMNA DERECHA: CRISTALES Y ENVÍO -->
                    <div class="space-y-6">
                        <div class="card p-8">
                            <div class="flex items-center gap-3 mb-6">
                                <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs">3</div>
                                <h3 class="font-black text-slate-700 uppercase tracking-tight">Cristales</h3>
                            </div>
                            <label class="label-text">Material / Diseño</label>
                            <select id="lens_type" class="input-field mb-6">
                                <option>Orgánico Blanco (Stock)</option>
                                <option>Policarbonato (Stock)</option>
                                <option>Laboratorio Monofocal</option>
                                <option>Bifocal Tallado</option>
                                <option>Multifocal Progresivo</option>
                                <option>Ocupacional</option>
                            </select>

                            <label class="label-text">Tratamientos</label>
                            <div class="space-y-2">
                                <label class="flex items-center gap-3 p-3 border rounded-xl hover:bg-blue-50 transition-colors cursor-pointer group">
                                    <input type="checkbox" class="treat w-4 h-4 rounded text-blue-600" value="Antirreflex">
                                    <span class="text-sm font-bold text-slate-600 group-hover:text-blue-700">Antirreflex</span>
                                </label>
                                <label class="flex items-center gap-3 p-3 border rounded-xl hover:bg-blue-50 transition-colors cursor-pointer group">
                                    <input type="checkbox" class="treat w-4 h-4 rounded text-blue-600" value="Blue Cut">
                                    <span class="text-sm font-bold text-slate-600 group-hover:text-blue-700">Filtro Blue Cut</span>
                                </label>
                                <label class="flex items-center gap-3 p-3 border rounded-xl hover:bg-blue-50 transition-colors cursor-pointer group">
                                    <input type="checkbox" class="treat w-4 h-4 rounded text-blue-600" value="Fotocromático">
                                    <span class="text-sm font-bold text-slate-600 group-hover:text-blue-700">Fotocromático</span>
                                </label>
                            </div>
                        </div>

                        <div class="card p-8">
                            <div class="flex items-center gap-3 mb-6">
                                <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs">4</div>
                                <h3 class="font-black text-slate-700 uppercase tracking-tight">Armazón</h3>
                            </div>
                            <div class="space-y-4">
                                <select id="frame_type" class="input-field">
                                    <option>Zilo / Acetato</option>
                                    <option>Metal</option>
                                    <option>Ranurado</option>
                                    <option>Al Aire (Tres Piezas)</option>
                                </select>
                                <input type="text" id="frame_model" class="input-field" placeholder="Modelo o Referencia">
                                <textarea id="notes" class="input-field h-24 resize-none" placeholder="Observaciones adicionales..."></textarea>
                            </div>
                        </div>

                        <button type="submit" id="submit-btn" class="w-full btn-primary !rounded-3xl shadow-2xl shadow-blue-300">
                            <span>ENVIAR PEDIDO</span>
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </form>
            </div>

            <!-- HISTORIAL -->
            <div id="view-history" class="hidden space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-3xl font-black text-slate-800 tracking-tight">Historial Reciente</h2>
                    <button onclick="clearHistory()" class="text-xs font-bold text-red-400 hover:text-red-600">Limpiar registros locales</button>
                </div>
                <div id="history-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Registros dinámicos -->
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- CONFIGURACIÓN DE INICIO ---
        emailjs.init("-NKT0dntx3JOPXYAA");

        let currentUser = localStorage.getItem('optica_user') || "";

        if (currentUser) {
            fastLogin(currentUser);
        }

        function fastLogin(autoUser = null) {
            const user = autoUser || document.getElementById('username').value.trim();
            if (!user) {
                alert("Por favor ingrese el nombre de la óptica");
                return;
            }

            currentUser = user;
            localStorage.setItem('optica_user', user);
            
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = `Panel de gestión de ${user}`;
            
            generateNewId();
            renderHistory();
        }

        function generateNewId() {
            const id = "OP" + Math.floor(1000 + Math.random() * 9000);
            document.getElementById('order-id').innerText = id;
        }

        function nav(view) {
            document.getElementById('view-new').classList.toggle('hidden', view !== 'new');
            document.getElementById('view-history').classList.toggle('hidden', view !== 'history');
            
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('text-blue-600', 'bg-blue-50');
                b.classList.add('text-slate-500');
            });
            const activeBtn = document.getElementById('btn-' + view);
            activeBtn.classList.remove('text-slate-500');
            activeBtn.classList.add('text-blue-600', 'bg-blue-50');
        }

        // --- LÓGICA DE ENVÍO Y PERSISTENCIA ---
        document.getElementById('orderForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> PROCESANDO...`;

            const orderId = document.getElementById('order-id').innerText;
            const treats = Array.from(document.querySelectorAll('.treat:checked')).map(c => c.value).join(", ") || "Ninguno";
            
            const orderData = {
                id: orderId,
                user: currentUser,
                patient: document.getElementById('p_name').value,
                contact: document.getElementById('p_contact').value,
                date: new Date().toLocaleString(),
                od: `${document.getElementById('od_esf').value} / ${document.getElementById('od_cil').value} x ${document.getElementById('od_eje').value} Add ${document.getElementById('od_add').value}`,
                oi: `${document.getElementById('oi_esf').value} / ${document.getElementById('oi_cil').value} x ${document.getElementById('oi_eje').value} Add ${document.getElementById('oi_add').value}`,
                lens: document.getElementById('lens_type').value,
                treatments: treats,
                frame: `${document.getElementById('frame_type').value} (${document.getElementById('frame_model').value})`,
                notes: document.getElementById('notes').value
            };

            try {
                // 1. Enviar Email
                await emailjs.send("service_bo6kzuc", "template_4e00pyr", {
                    to_name: "Laboratorio",
                    from_name: currentUser,
                    order_id: orderId,
                    patient_name: orderData.patient,
                    grad_od: orderData.od,
                    grad_oi: orderData.oi,
                    lens_details: orderData.lens + " con " + orderData.treatments,
                    frame_details: orderData.frame,
                    observations: orderData.notes
                });

                // 2. Guardar en historial local
                saveToHistory(orderData);

                alert("✅ ¡PEDIDO ENVIADO CON ÉXITO AL LABORATORIO!");
                document.getElementById('orderForm').reset();
                generateNewId();
                nav('history');

            } catch (err) {
                console.error(err);
                alert("❌ ERROR DE ENVÍO: " + (err.text || "Verifique su conexión a internet. El pedido se guardó en el historial."));
                saveToHistory(orderData);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }
        };

        function saveToHistory(order) {
            let history = JSON.parse(localStorage.getItem('optica_history') || "[]");
            history.unshift(order);
            localStorage.setItem('optica_history', JSON.stringify(history.slice(0, 50))); // Guardar últimos 50
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const history = JSON.parse(localStorage.getItem('optica_history') || "[]");
            
            if (history.length === 0) {
                list.innerHTML = `<div class="col-span-full p-20 text-center border-2 border-dashed rounded-3xl text-slate-400">
                    <i class="fas fa-folder-open text-4xl mb-4 block opacity-20"></i>
                    Aún no hay pedidos registrados.
                </div>`;
                return;
            }

            list.innerHTML = history.map(item => `
                <div class="card p-6 border-l-4 border-blue-500 hover:shadow-xl transition-all group">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="text-[10px] font-black text-blue-600 bg-blue-50 px-2 py-1 rounded-md uppercase tracking-tighter">${item.id}</span>
                            <h4 class="font-black text-slate-800 mt-2">${item.patient}</h4>
                        </div>
                        <span class="text-[9px] text-slate-400 font-bold">${item.date}</span>
                    </div>
                    <div class="space-y-2 text-xs">
                        <div class="flex justify-between">
                            <span class="text-slate-400 font-medium">Cristales:</span>
                            <span class="font-bold text-slate-700">${item.lens}</span>
                        </div>
                        <div class="bg-slate-50 p-2 rounded-lg text-[10px] font-mono leading-tight">
                            OD: ${item.od}<br>OI: ${item.oi}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function clearHistory() {
            if(confirm("¿Seguro que quieres borrar el historial local?")) {
                localStorage.setItem('optica_history', "[]");
                renderHistory();
            }
        }
    </script>
</body>
</html>
