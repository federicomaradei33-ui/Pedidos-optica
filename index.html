<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óptica Connect - Sistema de Pedidos Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import emailjs from "https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js?module";

        // Configuración de Firebase (Se llena automáticamente en el entorno)
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'optica-connect-pro';

        // Configuración de EmailJS
        const PUBLIC_KEY = "-NKT0dntx3JOPXYAA"; 
        const SERVICE_ID = "service_bo6kzuc";
        const TEMPLATE_ID = "template_4e00pyr";
        emailjs.init(PUBLIC_KEY);

        // Elementos UI
        const authSection = document.getElementById('auth-section');
        const appSection = document.getElementById('app-section');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const orderForm = document.getElementById('optica-form');
        const btnSubmit = document.getElementById('btn-submit');
        const statusMsg = document.getElementById('status-message');
        const userEmailDisplay = document.getElementById('user-email');
        const historyList = document.getElementById('history-list');

        let currentUser = null;

        // --- GESTIÓN DE AUTENTICACIÓN ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                authSection.classList.add('hidden');
                appSection.classList.remove('hidden');
                userEmailDisplay.innerText = user.email;
                loadHistory();
            } else {
                currentUser = null;
                authSection.classList.remove('hidden');
                appSection.classList.add('hidden');
            }
        });

        // Login
        loginForm.onsubmit = async (e) => {
            e.preventDefault();
            const email = e.target.email.value;
            const pass = e.target.password.value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) {
                alert("Error al iniciar sesión: " + err.message);
            }
        };

        // Registro
        registerForm.onsubmit = async (e) => {
            e.preventDefault();
            const email = e.target.email.value;
            const pass = e.target.password.value;
            try {
                await createUserWithEmailAndPassword(auth, email, pass);
                alert("Cuenta creada con éxito");
            } catch (err) {
                alert("Error al registrarse: " + err.message);
            }
        };

        window.logout = () => signOut(auth);
        window.toggleAuth = () => {
            loginForm.classList.toggle('hidden');
            registerForm.classList.toggle('hidden');
        };

        // --- GESTIÓN DE PEDIDOS ---
        async function loadHistory() {
            if (!currentUser) return;
            const q = query(
                collection(db, 'artifacts', appId, 'users', currentUser.uid, 'pedidos')
            );
            const querySnapshot = await getDocs(q);
            historyList.innerHTML = "";
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const item = document.createElement('div');
                item.className = "p-3 border-b text-sm flex justify-between";
                item.innerHTML = `<span><strong>${data.patient_name}</strong> - ${data.lente}</span> <span class="text-gray-400">${new Date(data.timestamp).toLocaleDateString()}</span>`;
                historyList.appendChild(item);
            });
        }

        orderForm.onsubmit = async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = "PROCESANDO...";

            const orderData = {
                patient_name: document.getElementById('p_name').value,
                od_esf: document.getElementById('od_esf').value,
                oi_esf: document.getElementById('oi_esf').value,
                lente: document.getElementById('lente_tipo').value,
                observaciones: document.getElementById('notas').value,
                order_id: Math.floor(10000 + Math.random() * 90000),
                timestamp: Date.now()
            };

            try {
                // 1. Guardar en Base de Datos (Cloud)
                await addDoc(collection(db, 'artifacts', appId, 'users', currentUser.uid, 'pedidos'), orderData);

                // 2. Enviar por EmailJS
                await emailjs.send(SERVICE_ID, TEMPLATE_ID, {
                    ...orderData,
                    graduacion: `OD: ${orderData.od_esf} | OI: ${orderData.oi_esf}`
                });

                statusMsg.innerText = "✅ Pedido guardado y enviado al laboratorio.";
                orderForm.reset();
                loadHistory();
            } catch (error) {
                statusMsg.innerText = "❌ Error: " + error.message;
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = "<span>ENVIAR PEDIDO</span>";
            }
        };
    </script>

    <style>
        .loader { border-top-color: #3498db; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- SECCIÓN DE AUTENTICACIÓN -->
    <div id="auth-section" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600 italic uppercase">ÓPTICA <span class="text-slate-400">CONNECT</span></h1>
            <p class="text-slate-500">Inicia sesión para gestionar pedidos</p>
        </div>

        <!-- Formulario Login -->
        <form id="login-form" class="space-y-4">
            <input type="email" name="email" placeholder="Email" class="w-full px-4 py-3 bg-slate-50 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500" required>
            <input type="password" name="password" placeholder="Contraseña" class="w-full px-4 py-3 bg-slate-50 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500" required>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">ENTRAR</button>
            <p class="text-center text-sm">¿No tienes cuenta? <a href="#" onclick="toggleAuth()" class="text-blue-600 font-bold">Regístrate</a></p>
        </form>

        <!-- Formulario Registro -->
        <form id="register-form" class="hidden space-y-4">
            <input type="email" name="email" placeholder="Nuevo Email" class="w-full px-4 py-3 bg-slate-50 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500" required>
            <input type="password" name="password" placeholder="Crear Contraseña" class="w-full px-4 py-3 bg-slate-50 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500" required>
            <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition">CREAR CUENTA</button>
            <p class="text-center text-sm">¿Ya tienes cuenta? <a href="#" onclick="toggleAuth()" class="text-blue-600 font-bold">Inicia Sesión</a></p>
        </form>
    </div>

    <!-- SECCIÓN DE LA APP (OCULTA HASTA LOGIN) -->
    <div id="app-section" class="hidden w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Formulario de Pedido -->
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
            <div class="bg-blue-600 p-4 text-white flex justify-between items-center">
                <span class="font-bold uppercase italic">Nuevo Pedido</span>
                <button onclick="logout()" class="text-xs bg-blue-800 px-2 py-1 rounded">Cerrar Sesión</button>
            </div>
            
            <form id="optica-form" class="p-6 space-y-5">
                <p class="text-xs text-slate-400">Usuario: <span id="user-email" class="font-bold"></span></p>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Paciente</label>
                    <input type="text" id="p_name" class="w-full px-4 py-2 bg-gray-50 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">OD (Esf)</label>
                        <input type="text" id="od_esf" class="w-full px-4 py-2 bg-gray-50 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">OI (Esf)</label>
                        <input type="text" id="oi_esf" class="w-full px-4 py-2 bg-gray-50 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Cristal</label>
                    <select id="lente_tipo" class="w-full px-4 py-2 bg-gray-50 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Monofocal">Monofocal</option>
                        <option value="Bifocal">Bifocal</option>
                        <option value="Multifocal">Multifocal</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Notas</label>
                    <textarea id="notas" class="w-full px-4 py-2 bg-gray-50 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 h-20 resize-none"></textarea>
                </div>

                <button type="submit" id="btn-submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-blue-100">
                    ENVIAR PEDIDO
                </button>
                <div id="status-message" class="text-center text-xs font-bold text-blue-600 mt-2"></div>
            </form>
        </div>

        <!-- Historial en la Nube -->
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
            <div class="bg-slate-800 p-4 text-white">
                <span class="font-bold uppercase text-sm">Mis Pedidos Recientes (Nube)</span>
            </div>
            <div id="history-list" class="h-[450px] overflow-y-auto p-4">
                <p class="text-center text-gray-400 mt-10 text-sm italic">Cargando historial...</p>
            </div>
        </div>
    </div>

</body>
</html>
