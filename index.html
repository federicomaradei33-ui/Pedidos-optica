<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óptica Connect - Sistema Integral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        .label { @apply text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 block; }
        .input { @apply w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all text-sm; }
        
        .receta-container { width: 100%; overflow: visible; }
        .grad-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .grad-table th { @apply text-[10px] font-bold text-slate-400 uppercase py-2 border-b text-center; }
        .grad-table td { @apply p-1 border-b; }
        .grad-table input { @apply w-full text-center py-1.5 bg-slate-50 rounded border-none text-sm focus:ring-1 focus:ring-blue-400; }

        #login-screen {
            position: fixed; inset: 0; background: #f1f5f9; z-index: 1000;
            display: flex; align-items: center; justify-content: center;
        }
        .loading-overlay {
            position: fixed; inset: 0; background: rgba(255,255,255,0.8);
            display: flex; align-items: center; justify-content: center; z-index: 2000;
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-overlay hidden">
        <div class="text-center">
            <i class="fas fa-spinner fa-spin text-4xl text-blue-600 mb-2"></i>
            <p id="loading-text" class="text-xs font-bold text-slate-500 uppercase">Sincronizando con la nube...</p>
        </div>
    </div>

    <!-- Pantalla de Login y Registro -->
    <div id="login-screen">
        <div class="card p-8 w-full max-w-md mx-4">
            <div class="text-center mb-6">
                <i class="fas fa-glasses text-4xl text-blue-600 mb-2"></i>
                <h2 class="text-2xl font-bold italic">Óptica Connect</h2>
                <div class="flex justify-center gap-4 mt-4 border-b">
                    <button onclick="toggleAuthMode('login')" id="tab-login" class="pb-2 text-xs font-bold border-b-2 border-blue-600 text-blue-600 uppercase">Ingresar</button>
                    <button onclick="toggleAuthMode('register')" id="tab-register" class="pb-2 text-xs font-bold border-b-2 border-transparent text-slate-400 uppercase">Registrarse</button>
                </div>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="label">Usuario</label>
                    <input type="text" id="user" class="input" placeholder="Tu usuario" required autocomplete="username">
                </div>
                <div>
                    <label class="label">Contraseña</label>
                    <input type="password" id="pass" class="input" placeholder="••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-all shadow-lg uppercase tracking-widest text-xs">
                    Entrar al Portal
                </button>
            </form>

            <form id="registerForm" class="hidden space-y-4">
                <div>
                    <label class="label">Nuevo Usuario</label>
                    <input type="text" id="reg-user" class="input" placeholder="Ej: Vendedor3" required>
                </div>
                <div>
                    <label class="label">Nueva Contraseña</label>
                    <input type="password" id="reg-pass" class="input" placeholder="Mínimo 4 caracteres" required>
                </div>
                <button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold hover:bg-emerald-700 transition-all shadow-lg uppercase tracking-widest text-xs">
                    Crear Cuenta
                </button>
            </form>
            <p class="text-[10px] text-center text-slate-400 mt-6 uppercase tracking-tighter">Acceso Seguro • Sincronización en la nube</p>
        </div>
    </div>

    <!-- Contenido Principal -->
    <div id="main-app" class="hidden">
        <header class="bg-white border-b sticky top-0 z-40">
            <div class="max-w-6xl mx-auto px-4 h-16 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fas fa-eye text-blue-600 text-xl"></i>
                    <span class="font-bold text-lg tracking-tight">Óptica Connect</span>
                </div>
                <div class="flex items-center gap-6">
                    <nav class="flex gap-4">
                        <button onclick="showSec('new')" id="nav-new" class="text-xs font-bold text-blue-600 border-b-2 border-blue-600 pb-1">NUEVO PEDIDO</button>
                        <button onclick="showSec('hist')" id="nav-hist" class="text-xs font-bold text-slate-400 pb-1">MI HISTORIAL</button>
                    </nav>
                    <div class="flex items-center gap-2 border-l pl-4 border-slate-200">
                        <span id="current-user-display" class="text-[10px] font-bold text-slate-500 uppercase bg-slate-100 px-2 py-1 rounded">---</span>
                        <button onclick="logout()" class="text-slate-400 hover:text-red-500 text-sm" title="Cerrar Sesión"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </div>
            </div>
        </header>

        <main class="max-w-5xl mx-auto p-4 md:p-8">
            <section id="sec-new" class="space-y-6">
                <div class="flex justify-between items-end">
                    <h2 class="text-2xl font-bold">Generar Orden de Trabajo</h2>
                    <div class="bg-white px-3 py-1 rounded border font-mono text-blue-600 font-bold"># <span id="order-id">---</span></div>
                </div>

                <form id="orderForm" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="space-y-6">
                        <div class="card p-6 border-l-4 border-blue-500">
                            <h3 class="font-bold text-sm mb-4 uppercase tracking-widest flex items-center gap-2"><i class="fas fa-user"></i> Datos del Paciente</h3>
                            <div class="space-y-4">
                                <input type="text" id="p_name" class="input" placeholder="Nombre completo" required>
                                <div class="grid grid-cols-2 gap-4">
                                    <input type="text" id="p_dni" class="input" placeholder="DNI / Documento">
                                    <input type="text" id="p_tel" class="input" placeholder="Teléfono">
                                </div>
                            </div>
                        </div>

                        <div class="card p-6 border-l-4 border-blue-500">
                            <h3 class="font-bold text-sm mb-4 uppercase tracking-widest flex items-center gap-2"><i class="fas fa-file-medical"></i> Receta Técnica</h3>
                            <div class="receta-container">
                                <table class="grad-table">
                                    <thead>
                                        <tr>
                                            <th style="width: 40px;"></th>
                                            <th>Esf.</th>
                                            <th>Cil.</th>
                                            <th>Eje</th>
                                            <th>Add</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td class="text-xs font-bold text-blue-600">OD</td>
                                            <td><input type="text" id="od_esf" placeholder="0.00"></td>
                                            <td><input type="text" id="od_cil" placeholder="0.00"></td>
                                            <td><input type="text" id="od_eje" placeholder="0°"></td>
                                            <td><input type="text" id="od_add" placeholder="0.00"></td>
                                        </tr>
                                        <tr>
                                            <td class="text-xs font-bold text-blue-600">OI</td>
                                            <td><input type="text" id="oi_esf" placeholder="0.00"></td>
                                            <td><input type="text" id="oi_cil" placeholder="0.00"></td>
                                            <td><input type="text" id="oi_eje" placeholder="0°"></td>
                                            <td><input type="text" id="oi_add" placeholder="0.00"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="grid grid-cols-2 gap-4 mt-6">
                                <div>
                                    <label class="label">DNP (Lejos/Cerca)</label>
                                    <input type="text" id="dnp" class="input" placeholder="Ej: 32/34">
                                </div>
                                <div>
                                    <label class="label">Altura Pupilar</label>
                                    <input type="text" id="altura" class="input" placeholder="Ej: 18mm">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div class="card p-6 border-l-4 border-blue-500">
                            <h3 class="font-bold text-sm mb-4 uppercase tracking-widest flex items-center gap-2"><i class="fas fa-layer-group"></i> Cristales y Tratamientos</h3>
                            <div class="space-y-4">
                                <select id="lens_type" class="input">
                                    <option>Monofocal Stock</option>
                                    <option>Monofocal Laboratorio</option>
                                    <option>Bifocal</option>
                                    <option>Multifocal</option>
                                    <option>Ocupacional</option>
                                </select>
                                <div class="grid grid-cols-2 gap-2">
                                    <label class="flex items-center gap-2 p-2 border rounded text-[11px] cursor-pointer hover:bg-slate-50"><input type="checkbox" name="treat" value="Antirreflex"> Antirreflex</label>
                                    <label class="flex items-center gap-2 p-2 border rounded text-[11px] cursor-pointer hover:bg-slate-50"><input type="checkbox" name="treat" value="Filtro Azul"> Filtro Azul</label>
                                    <label class="flex items-center gap-2 p-2 border rounded text-[11px] cursor-pointer hover:bg-slate-50"><input type="checkbox" name="treat" value="Fotocromático"> Fotocromático</label>
                                    <label class="flex items-center gap-2 p-2 border rounded text-[11px] cursor-pointer hover:bg-slate-50"><input type="checkbox" name="treat" value="Sin Tratamiento"> Sin Tratamiento</label>
                                </div>
                            </div>
                        </div>

                        <div class="card p-6 border-l-4 border-blue-500">
                            <h3 class="font-bold text-sm mb-4 uppercase tracking-widest flex items-center gap-2"><i class="fas fa-glasses"></i> Armazón</h3>
                            <div class="grid grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label class="label">Material</label>
                                    <select id="frame_mat" class="input">
                                        <option value="ZILO">ZILO</option>
                                        <option value="METAL">METAL</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="label">Marca / Modelo</label>
                                    <input type="text" id="frame_mod" class="input" placeholder="Ej: Ray-Ban">
                                </div>
                            </div>
                            <label class="label">Observaciones de taller</label>
                            <textarea id="obs" class="input h-20 resize-none" placeholder="Instrucciones especiales..."></textarea>
                        </div>

                        <button type="submit" id="btn-envio" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-xl hover:bg-blue-700 transition-all flex items-center justify-center gap-3 uppercase tracking-widest">
                            <i class="fas fa-paper-plane"></i> ENVIAR A LABORATORIO
                        </button>
                    </div>
                </form>
            </section>

            <section id="sec-hist" class="hidden space-y-6">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 class="text-2xl font-bold">Mis Pedidos</h2>
                        <p class="text-xs text-slate-400">Datos sincronizados en la nube</p>
                    </div>
                </div>
                <div id="history-container" class="space-y-4"></div>
            </section>
        </main>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // App State
        let currentUserAuth = null;
        let userData = null;
        let allOrders = [];

        // Loading utility
        const setLoading = (show, text = "Sincronizando...") => {
            const el = document.getElementById('loading');
            document.getElementById('loading-text').innerText = text;
            el.classList.toggle('hidden', !show);
        };

        // Auth initialization
        async function initAuth() {
            setLoading(true, "Iniciando Conexión...");
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error:", error);
            } finally {
                setLoading(false);
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserAuth = user;
                // Una vez autenticado, escuchamos los pedidos
                syncOrders();
            }
        });

        // Orders Sync
        function syncOrders() {
            if (!currentUserAuth) return;
            const ordersRef = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
            onSnapshot(ordersRef, (snapshot) => {
                allOrders = [];
                snapshot.forEach(doc => {
                    allOrders.push({ id: doc.id, ...doc.data() });
                });
                renderHistory();
            }, (err) => console.error("Orders sync error:", err));
        }

        // --- UI ACTIONS ---

        window.toggleAuthMode = (mode) => {
            const isLogin = mode === 'login';
            document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
            document.getElementById('registerForm').classList.toggle('hidden', isLogin);
            document.getElementById('tab-login').className = isLogin ? "pb-2 text-xs font-bold border-b-2 border-blue-600 text-blue-600 uppercase" : "pb-2 text-xs font-bold border-b-2 border-transparent text-slate-400 uppercase";
            document.getElementById('tab-register').className = !isLogin ? "pb-2 text-xs font-bold border-b-2 border-emerald-600 text-emerald-600 uppercase" : "pb-2 text-xs font-bold border-b-2 border-transparent text-slate-400 uppercase";
        };

        // Registro Mejorado
        document.getElementById('registerForm').onsubmit = async (e) => {
            e.preventDefault();
            const u = document.getElementById('reg-user').value.trim().toLowerCase();
            const p = document.getElementById('reg-pass').value;

            if(u.length < 3 || p.length < 4) return alert("Mínimo 3 letras de usuario y 4 de clave");
            
            setLoading(true, "Creando Usuario...");
            try {
                const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', u);
                const check = await getDoc(userRef);
                
                if(check.exists()) {
                    setLoading(false);
                    return alert("Este usuario ya existe.");
                }

                await setDoc(userRef, { password: p, created: new Date().toISOString() });
                alert("✅ Cuenta creada. Ya puedes ingresar.");
                window.toggleAuthMode('login');
            } catch (err) {
                alert("Error al registrar: " + err.message);
            } finally {
                setLoading(false);
            }
        };

        // Login Mejorado (Consulta Directa a Cloud)
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const u = document.getElementById('user').value.toLowerCase().trim();
            const p = document.getElementById('pass').value;

            setLoading(true, "Verificando Credenciales...");
            try {
                // Consultamos directamente el documento del usuario en Firestore
                const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', u);
                const userSnap = await getDoc(userRef);

                if(userSnap.exists() && userSnap.data().password === p) {
                    userData = { username: u };
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('main-app').classList.remove('hidden');
                    document.getElementById('current-user-display').innerText = u;
                    document.getElementById('order-id').innerText = Math.floor(1000 + Math.random() * 9000);
                    renderHistory();
                } else {
                    alert("⚠️ Usuario o clave incorrectos.");
                }
            } catch (err) {
                alert("Error de conexión: " + err.message);
            } finally {
                setLoading(false);
            }
        };

        window.logout = () => location.reload();

        window.showSec = (name) => {
            document.getElementById('sec-new').classList.toggle('hidden', name !== 'new');
            document.getElementById('sec-hist').classList.toggle('hidden', name !== 'hist');
            document.getElementById('nav-new').className = name === 'new' ? 'text-xs font-bold text-blue-600 border-b-2 border-blue-600 pb-1' : 'text-xs font-bold text-slate-400 pb-1';
            document.getElementById('nav-hist').className = name === 'hist' ? 'text-xs font-bold text-blue-600 border-b-2 border-blue-600 pb-1' : 'text-xs font-bold text-slate-400 pb-1';
        };

        document.getElementById('orderForm').onsubmit = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-envio');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ENVIANDO...';

            const v = (id) => document.getElementById(id).value || "---";
            const ts = Array.from(document.querySelectorAll('input[name="treat"]:checked')).map(c => c.value).join(', ') || 'Sin tratamientos';
            const oid = document.getElementById('order-id').innerText;

            const params = {
                order_id: oid,
                patient_name: v('p_name'),
                patient_id: `${v('p_dni')} / Tel: ${v('p_tel')}`,
                graduacion: `OD: ${v('od_esf')} / ${v('od_cil')} x ${v('od_eje')} (ADD: ${v('od_add')})\nOI: ${v('oi_esf')} / ${v('oi_cil')} x ${v('oi_eje')} (ADD: ${v('oi_add')})\nDNP: ${v('dnp')} | Altura: ${v('altura')}`,
                lens_details: v('lens_type'),
                treatments: ts,
                frame_details: `${v('frame_mat')} - ${v('frame_mod')}`,
                notes: v('obs'),
                date: new Date().toLocaleString(),
                created_by: userData.username
            };

            try {
                const orderDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', oid);
                await setDoc(orderDocRef, params);
                
                // Intento de envío de mail (EmailJS)
                await emailjs.init({ publicKey: "-NKT0dntx3JOPXYAA" });
                await emailjs.send("service_bo6kzuc", "template_4e00pyr", params);
                
                alert("✅ PEDIDO GUARDADO Y ENVIADO");
                this.reset();
                document.getElementById('order-id').innerText = Math.floor(1000 + Math.random() * 9000);
                window.showSec('hist');
            } catch (err) {
                alert("⚠️ Se guardó en la nube pero el mail falló: " + err.message);
                window.showSec('hist');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> ENVIAR A LABORATORIO';
            }
        };

        function renderHistory() {
            const cont = document.getElementById('history-container');
            if(!userData) return;

            const myOrders = allOrders
                .filter(o => o.created_by === userData.username)
                .sort((a, b) => new Date(b.date) - new Date(a.date));

            if(myOrders.length === 0) { 
                cont.innerHTML = '<div class="text-center py-10 bg-white rounded-xl border border-dashed border-slate-300"><p class="text-slate-400 text-sm">No hay pedidos registrados.</p></div>'; 
                return; 
            }
            
            cont.innerHTML = myOrders.map(o => `
                <div class="card p-6 border-l-4 border-blue-600 bg-white">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded">ORDEN #${o.order_id}</span>
                            <h4 class="text-lg font-bold mt-1">${o.patient_name}</h4>
                            <span class="text-xs text-slate-400"><i class="far fa-clock"></i> ${o.date}</span>
                        </div>
                        <button onclick="window.deleteOrder('${o.id}')" class="text-slate-300 hover:text-red-500"><i class="fas fa-trash"></i></button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                        <div class="bg-slate-50 p-3 rounded">
                            <p class="font-bold text-blue-600 mb-1 uppercase tracking-tighter">Graduación Técnica:</p>
                            <pre class="font-sans whitespace-pre-wrap">${o.graduacion}</pre>
                        </div>
                        <div class="bg-slate-50 p-3 rounded space-y-2">
                            <p><span class="font-bold">Cristal:</span> ${o.lens_details}</p>
                            <p><span class="font-bold">Tratamientos:</span> ${o.treatments}</p>
                            <p><span class="font-bold">Armazón:</span> ${o.frame_details}</p>
                            <p class="italic text-slate-500">Obs: "${o.notes}"</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.deleteOrder = async (id) => {
            if(confirm("¿Eliminar este pedido permanentemente?")) {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', id);
                await deleteDoc(docRef);
            }
        };

        initAuth();

    </script>
</body>
</html>
