<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Óptica Connect - Dashboard Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
        }

        .premium-card {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s ease;
        }

        .input-group {
            position: relative;
            margin-bottom: 1rem;
        }

        .input-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 0.4rem;
            letter-spacing: 0.05em;
        }

        .input-style {
            width: 100%;
            padding: 12px 16px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .input-style:focus {
            border-color: var(--primary);
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn-option {
            cursor: pointer;
            border: 2px solid #e2e8f0;
            background: #fff;
            padding: 12px 8px;
            border-radius: 14px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .btn-option.active {
            border-color: var(--primary);
            background: rgba(37, 99, 235, 0.05);
            color: var(--primary);
        }

        .receta-table th {
            font-size: 0.65rem;
            color: var(--text-muted);
            padding-bottom: 8px;
        }

        .receta-input {
            width: 100%;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
            font-weight: 700;
            font-size: 0.85rem;
        }

        #loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .tab-btn {
            position: relative;
            padding: 10px 20px;
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--text-muted);
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--primary);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background: var(--primary);
            border-radius: 10px;
        }

        .success-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 32px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            z-index: 10000;
            text-align: center;
            width: 85%;
            max-width: 350px;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { opacity: 0; transform: translate(-50%, -40%) scale(0.9); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body class="pb-24">

    <!-- Loading State -->
    <div id="loading-overlay">
        <div class="w-10 h-10 border-4 border-blue-400 border-t-transparent rounded-full animate-spin mb-4"></div>
        <span class="font-bold tracking-widest text-[10px] uppercase">Enviando a Laboratorio</span>
    </div>

    <!-- Success Modal -->
    <div id="success-modal" class="success-modal">
        <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
            <i class="fa-solid fa-check"></i>
        </div>
        <h3 class="text-xl font-bold mb-2">¡Pedido Exitoso!</h3>
        <p class="text-sm text-slate-500 mb-6">El trabajo ha sido registrado y enviado correctamente.</p>
        <button onclick="closeModal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all">
            ENTENDIDO
        </button>
    </div>

    <!-- Header / Navigation -->
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 py-4 mb-6">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                    <i class="fa-solid fa-eye text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-extrabold tracking-tight leading-none">ÓPTICA</h1>
                    <span class="text-[10px] font-bold text-blue-600 uppercase tracking-widest">Connect Pro</span>
                </div>
            </div>
            <div class="flex bg-slate-100 rounded-full p-1">
                <button onclick="switchTab('form')" id="tab-form" class="tab-btn active">NUEVO</button>
                <button onclick="switchTab('list')" id="tab-list" class="tab-btn">HISTORIAL</button>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-4">
        
        <!-- FORMULARIO -->
        <div id="section-form" class="space-y-6">
            
            <!-- Paciente -->
            <section class="premium-card p-6">
                <div class="input-group">
                    <label>Datos del Paciente</label>
                    <input type="text" id="p_name" placeholder="Nombre y Apellido" class="input-style mb-3">
                    <input type="text" id="p_id" placeholder="DNI o Teléfono de contacto" class="input-style">
                </div>
            </section>

            <!-- Receta -->
            <section class="premium-card p-6">
                <label class="text-[0.7rem] font-bold text-blue-600 uppercase mb-4 block tracking-wider">Prescripción Médica</label>
                <div class="overflow-x-auto">
                    <table class="w-full receta-table border-separate border-spacing-2">
                        <thead>
                            <tr>
                                <th></th>
                                <th>ESF.</th>
                                <th>CIL.</th>
                                <th>EJE</th>
                                <th>ADD.</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="text-[10px] font-extrabold text-blue-600">OD</td>
                                <td><input type="text" id="od_esf" value="0.00" class="receta-input"></td>
                                <td><input type="text" id="od_cil" value="0.00" class="receta-input"></td>
                                <td><input type="text" id="od_eje" value="0" class="receta-input"></td>
                                <td><input type="text" id="od_add" value="+0.00" class="receta-input"></td>
                            </tr>
                            <tr>
                                <td class="text-[10px] font-extrabold text-blue-600">OI</td>
                                <td><input type="text" id="oi_esf" value="0.00" class="receta-input"></td>
                                <td><input type="text" id="oi_cil" value="0.00" class="receta-input"></td>
                                <td><input type="text" id="oi_eje" value="0" class="receta-input"></td>
                                <td><input type="text" id="oi_add" value="+0.00" class="receta-input"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Armazón -->
            <section class="premium-card p-6">
                <label class="text-[0.7rem] font-bold text-blue-600 uppercase mb-4 block tracking-wider">Armazón Seleccionado</label>
                <div class="grid grid-cols-3 gap-3 mb-4">
                    <button class="btn-option armazon-btn" onclick="setArmazon(this, 'Zilo')">
                        <i class="fa-solid fa-square text-lg opacity-40"></i>
                        ZILO
                    </button>
                    <button class="btn-option armazon-btn" onclick="setArmazon(this, 'Metal')">
                        <i class="fa-solid fa-circle-nodes text-lg opacity-40"></i>
                        METAL
                    </button>
                    <button class="btn-option armazon-btn" onclick="setArmazon(this, 'Ranura')">
                        <i class="fa-solid fa-grip-lines text-lg opacity-40"></i>
                        RANURA
                    </button>
                </div>
                <input type="text" id="armazon_modelo" placeholder="Marca, Modelo y Color..." class="input-style">
            </section>

            <!-- Lentes -->
            <section class="premium-card p-6">
                <label class="text-[0.7rem] font-bold text-blue-600 uppercase mb-4 block tracking-wider">Lente y Tratamientos</label>
                <select id="tipo_cristal" class="input-style mb-4 font-bold text-slate-700">
                    <option>Monofocal Stock</option>
                    <option>Monofocal Laboratorio</option>
                    <option>Bifocal</option>
                    <option>Multifocal Premium</option>
                    <option>Multifocal Standard</option>
                </select>
                <div class="grid grid-cols-4 gap-2">
                    <button class="btn-option treat-btn" onclick="toggleTreat(this, 'AR')">AR</button>
                    <button class="btn-option treat-btn" onclick="toggleTreat(this, 'Blue')">BLUE</button>
                    <button class="btn-option treat-btn" onclick="toggleTreat(this, 'Foto')">FOTO</button>
                    <button class="btn-option treat-btn" onclick="toggleTreat(this, 'HC')">HC</button>
                </div>
            </section>

            <!-- Observaciones -->
            <section class="premium-card p-6">
                <label class="text-[0.7rem] font-bold text-blue-600 uppercase mb-4 block tracking-wider">Notas Adicionales</label>
                <textarea id="obs" placeholder="Instrucciones específicas para el laboratorio..." class="input-style h-24 resize-none"></textarea>
            </section>

            <button onclick="handleEnvio()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-5 rounded-2xl shadow-xl shadow-blue-200 transition-all flex items-center justify-center gap-3 active:scale-[0.98]">
                <i class="fa-solid fa-paper-plane"></i>
                CONFIRMAR Y ENVIAR
            </button>
        </div>

        <!-- LISTADO / HISTORIAL -->
        <div id="section-list" class="hidden">
            <div id="history-container" class="space-y-4 py-4">
                <!-- Skeleton loader o mensaje vacío -->
            </div>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, query } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'optica-connect-v1';

        // State global accesible por el HTML
        window.currentArmazon = "";
        window.currentTreats = [];

        window.setArmazon = (el, val) => {
            document.querySelectorAll('.armazon-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            window.currentArmazon = val;
        };

        window.toggleTreat = (el, val) => {
            if (window.currentTreats.includes(val)) {
                window.currentTreats = window.currentTreats.filter(t => t !== val);
                el.classList.remove('active');
            } else {
                window.currentTreats.push(val);
                el.classList.add('active');
            }
        };

        window.switchTab = (tab) => {
            const isForm = tab === 'form';
            document.getElementById('section-form').classList.toggle('hidden', !isForm);
            document.getElementById('section-list').classList.toggle('hidden', isForm);
            document.getElementById('tab-form').classList.toggle('active', isForm);
            document.getElementById('tab-list').classList.toggle('active', !isForm);
        };

        window.closeModal = () => {
            document.getElementById('success-modal').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            // Reset parcial
            document.getElementById('p_name').value = '';
            document.getElementById('p_id').value = '';
            document.getElementById('armazon_modelo').value = '';
            document.getElementById('obs').value = '';
        };

        window.handleEnvio = async () => {
            const name = document.getElementById('p_name').value;
            if (!name) { 
                alert("Debes ingresar al menos el nombre del paciente."); 
                return; 
            }

            document.getElementById('loading-overlay').style.display = 'flex';

            const payload = {
                paciente: name,
                documento: document.getElementById('p_id').value || "No registrado",
                receta_od: `${document.getElementById('od_esf').value} / ${document.getElementById('od_cil').value} x ${document.getElementById('od_eje').value}° (ADD ${document.getElementById('od_add').value})`,
                receta_oi: `${document.getElementById('oi_esf').value} / ${document.getElementById('oi_cil').value} x ${document.getElementById('oi_eje').value}° (ADD ${document.getElementById('oi_add').value})`,
                armazon: `${window.currentArmazon || 'No especificado'} - ${document.getElementById('armazon_modelo').value}`,
                cristales: document.getElementById('tipo_cristal').value,
                tratamientos: window.currentTreats.join(", ") || "Sin tratamientos",
                observaciones: document.getElementById('obs').value,
                fecha: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                timestamp: serverTimestamp()
            };

            try {
                // Guardar en Firestore siguiendo las reglas de la plataforma
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'pedidos');
                await addDoc(colRef, payload);

                // EmailJS opcional
                try {
                    await emailjs.send("service_bo6kzuc", "template_4e00pyr", {
                        to_name: "Laboratorio Central",
                        from_name: "Óptica Connect Pro",
                        message: `NUEVO PEDIDO: ${payload.paciente} \n Lentes: ${payload.cristales} \n Armazón: ${payload.armazon}`,
                        patient_name: payload.paciente
                    }, "user_YOUR_ID_IF_NEEDED");
                } catch (e) { console.warn("Email no enviado, pero pedido guardado."); }

                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('success-modal').style.display = 'block';

            } catch (err) {
                console.error(err);
                alert("Hubo un error de conexión. Intenta nuevamente.");
                document.getElementById('loading-overlay').style.display = 'none';
            }
        };

        // Escucha en tiempo real del historial
        signInAnonymously(auth).then(() => {
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'pedidos');
            onSnapshot(q, (snap) => {
                const container = document.getElementById('history-container');
                let items = [];
                snap.forEach(doc => items.push(doc.data()));
                
                // Ordenar por fecha (más reciente primero)
                items.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

                if (items.length === 0) {
                    container.innerHTML = `
                        <div class="py-20 text-center opacity-30">
                            <i class="fa-solid fa-folder-open text-5xl mb-4"></i>
                            <p class="font-bold text-sm uppercase tracking-widest">No hay pedidos registrados</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = items.map(it => `
                    <div class="premium-card p-5 border-l-4 border-l-blue-600">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h4 class="font-extrabold text-sm uppercase tracking-tight">${it.paciente}</h4>
                                <p class="text-[10px] text-slate-400 font-bold">${it.fecha}</p>
                            </div>
                            <div class="bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-[9px] font-black uppercase">
                                Pendiente
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4 text-[10px] text-slate-600">
                            <div>
                                <span class="block font-bold text-blue-500 uppercase text-[8px] mb-1">Lente</span>
                                ${it.cristales}
                            </div>
                            <div>
                                <span class="block font-bold text-blue-500 uppercase text-[8px] mb-1">Armazón</span>
                                ${it.armazon.split('-')[0]}
                            </div>
                        </div>
                    </div>
                `).join('');
            });
        });

    </script>
</body>
</html>
