<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óptica Connect - Sistema de Órdenes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        
        .glass-card { background: white; border-radius: 20px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        
        /* Botones de selección mejorados para evitar bloqueos */
        .selectable-button {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 700;
            border: 2px solid #e2e8f0;
            background: #ffffff;
            color: #64748b;
            transition: all 0.2s ease;
            cursor: pointer;
            text-align: center;
            display: block;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 10; /* Asegura que esté por encima de cualquier capa */
        }
        
        .selectable-button.active {
            background: #2563eb !important;
            color: white !important;
            border-color: #2563eb !important;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }

        .input-field { 
            width: 100%; 
            padding: 0.75rem; 
            border: 1px solid #e2e8f0; 
            border-radius: 10px; 
            background: #f1f5f9;
        }

        .loading-overlay { 
            position: fixed; 
            inset: 0; 
            background: rgba(255,255,255,0.8); 
            z-index: 9999; 
            display: none; 
            align-items: center; 
            justify-content: center; 
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <div id="loader" class="loading-overlay">
        <div class="text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-blue-600 border-solid mx-auto"></div>
            <p class="mt-4 font-bold text-blue-600 uppercase tracking-widest">Enviando Orden...</p>
        </div>
    </div>

    <nav class="bg-white border-b px-6 py-4 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fas fa-glasses text-blue-600 text-2xl"></i>
                <span class="font-extrabold text-xl tracking-tighter">ÓPTICA<span class="text-blue-600">CONNECT</span></span>
            </div>
            <div class="flex gap-2">
                <button id="nav-form" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-sm">NUEVA</button>
                <button id="nav-list" class="bg-slate-100 text-slate-600 px-4 py-2 rounded-lg font-bold text-sm">HISTORIAL</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4">
        
        <!-- VISTA FORMULARIO -->
        <div id="section-form">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                
                <!-- Datos y Receta -->
                <div class="lg:col-span-2 space-y-6">
                    <div class="glass-card p-6">
                        <h3 class="text-blue-600 font-black text-xs uppercase mb-4 tracking-widest">Paciente</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <input type="text" id="p-nombre" class="input-field" placeholder="Nombre completo">
                            <input type="text" id="p-tel" class="input-field" placeholder="Teléfono/WhatsApp">
                        </div>
                    </div>

                    <div class="glass-card p-6 overflow-x-auto">
                        <h3 class="text-blue-600 font-black text-xs uppercase mb-4 tracking-widest">Graduación</h3>
                        <table class="w-full text-center">
                            <tr class="text-[10px] text-slate-400 font-black uppercase">
                                <th class="pb-2">Ojo</th>
                                <th class="pb-2">Esf</th>
                                <th class="pb-2">Cil</th>
                                <th class="pb-2">Eje</th>
                            </tr>
                            <tr>
                                <td class="font-black text-blue-600 py-2">OD</td>
                                <td><input type="text" id="od-esf" class="w-16 p-1 text-center bg-slate-50 border rounded" value="0.00"></td>
                                <td><input type="text" id="od-cil" class="w-16 p-1 text-center bg-slate-50 border rounded" value="0.00"></td>
                                <td><input type="text" id="od-eje" class="w-16 p-1 text-center bg-slate-50 border rounded" value="0"></td>
                            </tr>
                            <tr>
                                <td class="font-black text-blue-600 py-2">OI</td>
                                <td><input type="text" id="oi-esf" class="w-16 p-1 text-center bg-slate-50 border rounded" value="0.00"></td>
                                <td><input type="text" id="oi-cil" class="w-16 p-1 text-center bg-slate-50 border rounded" value="0.00"></td>
                                <td><input type="text" id="oi-eje" class="w-16 p-1 text-center bg-slate-50 border rounded" value="0"></td>
                            </tr>
                        </table>
                    </div>
                </div>

                <!-- Opciones que no te funcionaban -->
                <div class="space-y-6">
                    <div class="glass-card p-6">
                        <h3 class="text-blue-600 font-black text-xs uppercase mb-4 tracking-widest">Armazón (Material)</h3>
                        <div class="space-y-2">
                            <button type="button" class="selectable-button material-btn active" data-value="Zilo">ZILO</button>
                            <button type="button" class="selectable-button material-btn" data-value="Metal">METAL</button>
                            <button type="button" class="selectable-button material-btn" data-value="Ranura">RANURA</button>
                        </div>
                    </div>

                    <div class="glass-card p-6">
                        <h3 class="text-blue-600 font-black text-xs uppercase mb-4 tracking-widest">Tratamientos</h3>
                        <div class="space-y-2">
                            <button type="button" class="selectable-button tratamiento-btn active" data-value="Sin tratamiento">SIN TRATAMIENTO</button>
                            <button type="button" class="selectable-button tratamiento-btn" data-value="Antirreflex">ANTIRREFLEX</button>
                            <button type="button" class="selectable-button tratamiento-btn" data-value="Filtro Azul">FILTRO AZUL</button>
                        </div>
                    </div>
                </div>

            </div>

            <button id="btn-enviar" class="w-full mt-8 bg-blue-600 text-white font-black py-5 rounded-2xl shadow-xl hover:bg-blue-700 transition-all flex items-center justify-center gap-3">
                <i class="fas fa-save"></i> GUARDAR Y ENVIAR ORDEN
            </button>
        </div>

        <!-- VISTA LISTADO -->
        <div id="section-list" class="hidden">
            <h2 class="text-2xl font-black mb-6">Historial de Órdenes</h2>
            <div id="container-pedidos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Se llena dinámicamente -->
            </div>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuración Firebase
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'optica-connect-default';

        // Estado local
        let materialSeleccionado = "Zilo";
        let tratamientosSeleccionados = ["Sin tratamiento"];

        // Esperar a que el DOM esté listo
        document.addEventListener('DOMContentLoaded', () => {
            
            // 1. Lógica de Navegación
            const navForm = document.getElementById('nav-form');
            const navList = document.getElementById('nav-list');
            const sectionForm = document.getElementById('section-form');
            const sectionList = document.getElementById('section-list');

            navForm.onclick = () => {
                sectionForm.classList.remove('hidden');
                sectionList.classList.add('hidden');
                navForm.className = "bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-sm";
                navList.className = "bg-slate-100 text-slate-600 px-4 py-2 rounded-lg font-bold text-sm";
            };

            navList.onclick = () => {
                sectionForm.classList.add('hidden');
                sectionList.classList.remove('hidden');
                navList.className = "bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-sm";
                navForm.className = "bg-slate-100 text-slate-600 px-4 py-2 rounded-lg font-bold text-sm";
            };

            // 2. Lógica de Materiales (CORRECCIÓN CRUCIAL)
            const materialButtons = document.querySelectorAll('.material-btn');
            materialButtons.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    materialButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    materialSeleccionado = this.getAttribute('data-value');
                    console.log("Material cambiado a:", materialSeleccionado);
                });
            });

            // 3. Lógica de Tratamientos (CORRECCIÓN CRUCIAL)
            const tratamientoButtons = document.querySelectorAll('.tratamiento-btn');
            tratamientoButtons.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const value = this.getAttribute('data-value');

                    if (value === "Sin tratamiento") {
                        tratamientosSeleccionados = ["Sin tratamiento"];
                    } else {
                        // Quitar "Sin tratamiento" si seleccionas uno específico
                        tratamientosSeleccionados = tratamientosSeleccionados.filter(t => t !== "Sin tratamiento");
                        
                        if (tratamientosSeleccionados.includes(value)) {
                            tratamientosSeleccionados = tratamientosSeleccionados.filter(t => t !== value);
                        } else {
                            tratamientosSeleccionados.push(value);
                        }

                        // Si desmarcas todo, vuelve a "Sin tratamiento"
                        if (tratamientosSeleccionados.length === 0) {
                            tratamientosSeleccionados = ["Sin tratamiento"];
                        }
                    }

                    // Actualizar UI visualmente
                    tratamientoButtons.forEach(b => {
                        const bVal = b.getAttribute('data-value');
                        if (tratamientosSeleccionados.includes(bVal)) {
                            b.classList.add('active');
                        } else {
                            b.classList.remove('active');
                        }
                    });
                    console.log("Tratamientos:", tratamientosSeleccionados);
                });
            });

            // 4. Enviar Orden
            document.getElementById('btn-enviar').onclick = async () => {
                const nombre = document.getElementById('p-nombre').value;
                if (!nombre) return alert("Ingresa el nombre del paciente");

                document.getElementById('loader').style.display = 'flex';

                try {
                    await signInAnonymously(auth);
                    const pedido = {
                        paciente: nombre,
                        tel: document.getElementById('p-tel').value,
                        material: materialSeleccionado,
                        tratamientos: tratamientosSeleccionados,
                        graduacion: {
                            od: `${document.getElementById('od-esf').value} / ${document.getElementById('od-cil').value} x ${document.getElementById('od-eje').value}`,
                            oi: `${document.getElementById('oi-esf').value} / ${document.getElementById('oi-cil').value} x ${document.getElementById('oi-eje').value}`
                        },
                        timestamp: serverTimestamp()
                    };

                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'pedidos'), pedido);
                    alert("¡Orden enviada con éxito!");
                    location.reload(); // Recarga para limpiar todo
                } catch (err) {
                    console.error(err);
                    alert("Error de conexión");
                } finally {
                    document.getElementById('loader').style.display = 'none';
                }
            };
        });

        // 5. Escuchar pedidos en tiempo real para el historial
        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'pedidos'), (snap) => {
            const container = document.getElementById('container-pedidos');
            const list = [];
            snap.forEach(doc => list.push(doc.data()));
            
            container.innerHTML = list.map(p => `
                <div class="glass-card p-4 border-l-4 border-blue-600">
                    <p class="font-black uppercase text-sm">${p.paciente}</p>
                    <div class="mt-2 text-[11px] text-slate-500 font-bold space-y-1">
                        <p>MATERIAL: ${p.material}</p>
                        <p>TRATAMIENTOS: ${p.tratamientos.join(', ')}</p>
                        <p>OD: ${p.graduacion.od}</p>
                        <p>OI: ${p.graduacion.oi}</p>
                    </div>
                </div>
            `).join('');
        });

    </script>
</body>
</html>
