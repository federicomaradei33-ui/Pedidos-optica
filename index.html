<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óptica Pro - Acceso Restringido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .glass-effect { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); }
        .order-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .order-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.1); }
        
        /* Animaciones */
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-slate-900">

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-100 p-4">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full max-w-md border border-slate-200">
            <div class="flex flex-col items-center mb-8">
                <div class="bg-blue-600 p-4 rounded-2xl text-white mb-4 shadow-lg shadow-blue-200">
                    <i class="fas fa-eye-low-vision fa-2xl"></i>
                </div>
                <h1 class="text-2xl font-black tracking-tight text-slate-800">Óptica<span class="text-blue-600">Pro</span></h1>
                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mt-1">Control de Acceso</p>
            </div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1 ml-2">Usuario</label>
                    <input type="text" id="user-input" required class="w-full bg-slate-50 border border-slate-200 p-4 rounded-xl focus:ring-2 focus:ring-blue-500/20 outline-none transition-all" placeholder="Admin">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1 ml-2">Contraseña</label>
                    <input type="password" id="pass-input" required class="w-full bg-slate-50 border border-slate-200 p-4 rounded-xl focus:ring-2 focus:ring-blue-500/20 outline-none transition-all" placeholder="••••">
                </div>
                <button type="submit" class="w-full bg-slate-900 text-white p-4 rounded-xl font-bold hover:bg-blue-600 transition-all shadow-lg active:scale-[0.98]">
                    Ingresar al Sistema
                </button>
            </form>
            <p id="login-error" class="text-red-500 text-xs text-center mt-4 font-bold hidden">Credenciales incorrectas</p>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL (Oculto inicialmente) -->
    <div id="main-content" class="hidden opacity-0 transition-opacity duration-500">
        <!-- Status Bar -->
        <div class="fixed top-4 right-4 z-50 flex items-center gap-2 px-3 py-1.5 rounded-full bg-white shadow-sm border border-slate-200 text-[10px] font-bold tracking-tighter">
            <div id="sync-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></div>
            <span id="sync-text" class="text-slate-500 uppercase">Sincronizando...</span>
        </div>

        <!-- Navegación -->
        <nav class="bg-white border-b border-slate-200 sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 p-2 rounded-lg text-white"><i class="fas fa-eye"></i></div>
                    <span class="text-xl font-bold tracking-tight">Óptica<span class="text-blue-600">Pro</span></span>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2">
                        <i class="fas fa-plus"></i> Nueva Orden
                    </button>
                    <button onclick="logout()" class="p-2 text-slate-400 hover:text-red-500 transition-colors">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 py-8">
            <!-- Estadísticas -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <p class="text-slate-400 text-[10px] font-bold uppercase mb-1">Total de Órdenes</p>
                    <h3 class="text-2xl font-black" id="stat-total">0</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <p class="text-blue-500 text-[10px] font-bold uppercase mb-1">Enviadas hoy</p>
                    <h3 class="text-2xl font-black text-blue-600" id="stat-today">0</h3>
                </div>
                <div class="bg-slate-900 p-6 rounded-2xl shadow-xl text-white">
                    <p class="text-slate-400 text-[10px] font-bold uppercase mb-1">Usuario Activo</p>
                    <h3 class="text-sm font-mono truncate">Administrador</h3>
                </div>
            </div>

            <!-- Listado -->
            <div id="orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Los pedidos se cargan aquí -->
            </div>
        </main>
    </div>

    <!-- Modal Formulario -->
    <div id="order-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden">
        <div class="bg-white w-full max-w-xl rounded-[2rem] shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="text-xl font-bold text-slate-800">Cargar Nuevo Trabajo</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
            </div>
            <form id="order-form" class="p-6 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1">Paciente</label>
                        <input type="text" id="paciente" required class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl outline-none" placeholder="Nombre completo">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1">Armazón</label>
                        <input type="text" id="armazon" required class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl outline-none" placeholder="Marca/Modelo">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1">Graduación</label>
                        <input type="text" id="graduacion" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl outline-none" placeholder="+1.00 / -0.50">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1">Email Laboratorio</label>
                        <input type="email" id="email-lab" required class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl outline-none" placeholder="lab@ejemplo.com">
                    </div>
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold shadow-lg shadow-blue-100 flex items-center justify-center gap-2">
                    <i class="fas fa-paper-plane"></i> Guardar y Notificar Lab
                </button>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[100] px-6 py-3 rounded-full bg-slate-900 text-white text-xs font-bold shadow-2xl transition-all translate-y-20 opacity-0 flex items-center gap-3">
        <i class="fas fa-check-circle text-emerald-400"></i>
        <span id="toast-msg">Mensaje</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, query, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'optica-pro-1234';

        let userLoaded = false;

        // --- SISTEMA DE LOGIN ---
        document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            const user = document.getElementById('user-input').value;
            const pass = document.getElementById('pass-input').value;

            if(user === "Admin" && pass === "1234") {
                loginSuccess();
            } else {
                const err = document.getElementById('login-error');
                err.classList.remove('hidden');
                setTimeout(() => err.classList.add('hidden'), 3000);
            }
        };

        async function loginSuccess() {
            document.getElementById('login-screen').classList.add('hidden');
            const main = document.getElementById('main-content');
            main.classList.remove('hidden');
            setTimeout(() => main.classList.remove('opacity-0'), 50);
            
            // Iniciar Firebase después del login manual exitoso
            await signInAnonymously(auth);
        }

        window.logout = () => {
            location.reload();
        };

        // --- MANEJO DE DATOS ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('sync-dot').classList.replace('bg-amber-400', 'bg-emerald-500');
                document.getElementById('sync-text').innerText = "Sincronizado";
                initDataListener();
            }
        });

        function initDataListener() {
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'ordenes');
            onSnapshot(q, (snapshot) => {
                const grid = document.getElementById('orders-grid');
                let html = "";
                let total = 0;
                
                const docs = [];
                snapshot.forEach(d => docs.push({id: d.id, ...d.data()}));
                docs.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

                docs.forEach(data => {
                    total++;
                    const date = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleDateString() : 'Pendiente';
                    html += `
                        <div class="bg-white rounded-3xl border border-slate-200 p-6 order-card relative fade-in">
                            <div class="flex justify-between items-start mb-4">
                                <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center text-blue-600">
                                    <i class="fas fa-file-invoice"></i>
                                </div>
                                <span class="text-[9px] font-black bg-blue-100 text-blue-600 px-2 py-1 rounded-lg uppercase tracking-tight">Email Enviado</span>
                            </div>
                            <h4 class="font-bold text-slate-800">${data.paciente}</h4>
                            <p class="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-4">${data.armazon}</p>
                            <div class="text-[11px] text-slate-500 space-y-1 mb-4">
                                <p><i class="fas fa-eye w-4"></i> Grad: ${data.graduacion || '-'}</p>
                                <p><i class="fas fa-envelope w-4"></i> Lab: ${data.emailLab}</p>
                            </div>
                            <div class="pt-4 border-t border-slate-100 flex justify-between items-center">
                                <span class="text-[9px] font-bold text-slate-300">${date}</span>
                                <button onclick="borrar('${data.id}')" class="text-slate-300 hover:text-red-500 transition-colors">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });

                grid.innerHTML = total === 0 ? '<div class="col-span-full py-20 text-center text-slate-400 font-bold">Sin órdenes registradas</div>' : html;
                document.getElementById('stat-total').innerText = total;
            }, (error) => {
                console.error("Fallo de lectura:", error);
            });
        }

        // --- ACCIONES ---
        window.openModal = () => document.getElementById('order-modal').classList.remove('hidden');
        window.closeModal = () => document.getElementById('order-modal').classList.add('hidden');

        document.getElementById('order-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const data = {
                paciente: document.getElementById('paciente').value,
                armazon: document.getElementById('armazon').value,
                graduacion: document.getElementById('graduacion').value,
                emailLab: document.getElementById('email-lab').value,
                createdAt: serverTimestamp()
            };

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch animate-spin"></i> Procesando...';

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'ordenes'), data);
                showToast("¡Orden enviada con éxito!");
                closeModal();
                e.target.reset();
            } catch (err) {
                showToast("Error de conexión");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Guardar y Notificar Lab';
            }
        };

        window.borrar = async (id) => {
            if(confirm("¿Eliminar este registro?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'ordenes', id));
                showToast("Registro eliminado");
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 3000);
        }
    </script>
</body>
</html>
