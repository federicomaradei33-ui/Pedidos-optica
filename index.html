<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óptica Pro - Acceso Directo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="antialiased">

    <!-- PANTALLA DE INGRESO (CAPA SUPERIOR) -->
    <div id="login-screen" class="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-900">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm mx-4 fade-in">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 text-white rounded-2xl mb-4 shadow-lg shadow-blue-500/30">
                    <i class="fas fa-glasses fa-2xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-800">Óptica<span class="text-blue-600">Pro</span></h1>
                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mt-1">Panel Administrativo</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <input type="text" id="user-input" class="w-full bg-slate-100 border-2 border-transparent focus:border-blue-500 p-4 rounded-xl outline-none transition-all" placeholder="Usuario (Admin)">
                </div>
                <div>
                    <input type="password" id="pass-input" class="w-full bg-slate-100 border-2 border-transparent focus:border-blue-500 p-4 rounded-xl outline-none transition-all" placeholder="Contraseña (1234)">
                </div>
                <button id="btn-entrar" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-xl font-bold transition-all transform active:scale-95 shadow-lg shadow-blue-500/20">
                    Entrar Ahora
                </button>
                <div id="login-error" class="hidden text-red-500 text-sm font-bold text-center bg-red-50 p-3 rounded-lg border border-red-100">
                    Credenciales incorrectas
                </div>
            </div>
        </div>
    </div>

    <!-- APP PRINCIPAL (OCULTA HASTA EL LOGIN) -->
    <div id="app-content" class="hidden min-h-screen">
        <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
            <div class="max-w-6xl mx-auto px-4 h-16 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fas fa-eye text-blue-600 text-xl"></i>
                    <span class="font-bold text-lg">ÓpticaPro</span>
                </div>
                <button onclick="document.getElementById('modal-nueva').classList.remove('hidden')" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md hover:bg-blue-700">
                    + Nuevo Trabajo
                </button>
            </div>
        </nav>

        <main class="max-w-6xl mx-auto px-4 py-8">
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-slate-800">Trabajos en curso</h2>
                <p class="text-slate-500 text-sm">Visualización en tiempo real de órdenes</p>
            </div>

            <div id="lista-ordenes" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Los trabajos aparecerán aquí -->
                <div class="col-span-full py-12 text-center text-slate-400">
                    <i class="fas fa-spinner animate-spin fa-2xl mb-4 text-blue-200"></i>
                    <p>Sincronizando base de datos...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL NUEVA ORDEN -->
    <div id="modal-nueva" class="fixed inset-0 z-[100] bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-lg">Detalles de la Orden</h3>
                <button onclick="document.getElementById('modal-nueva').classList.add('hidden')" class="text-slate-400 hover:text-slate-600 text-xl">&times;</button>
            </div>
            <form id="form-orden" class="p-6 space-y-4">
                <input type="text" id="paciente" placeholder="Nombre del Paciente" required class="w-full bg-slate-50 border border-slate-200 p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20">
                <input type="text" id="armazon" placeholder="Modelo de Armazón" required class="w-full bg-slate-50 border border-slate-200 p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20">
                <input type="text" id="graduacion" placeholder="Graduación (Ej: +1.50 OD)" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20">
                <input type="email" id="laboratorio" placeholder="Email del Laboratorio" required class="w-full bg-slate-50 border border-slate-200 p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/20">
                <button type="submit" class="w-full bg-slate-900 text-white p-4 rounded-xl font-bold hover:bg-blue-600 transition-colors shadow-lg">
                    Cargar Trabajo
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuración manual para asegurar carga
        const config = JSON.parse(__firebase_config);
        const appID = typeof __app_id !== 'undefined' ? __app_id : 'optica-pro-local';

        const btnEntrar = document.getElementById('btn-entrar');
        const loginError = document.getElementById('login-error');

        // FUNCIÓN DE INICIO DE SESIÓN LOCAL
        btnEntrar.addEventListener('click', () => {
            const user = document.getElementById('user-input').value;
            const pass = document.getElementById('pass-input').value;

            if (user === "Admin" && pass === "1234") {
                loginError.classList.add('hidden');
                ejecutarApp();
            } else {
                loginError.classList.remove('hidden');
                setTimeout(() => loginError.classList.add('hidden'), 3000);
            }
        });

        // Solo se ejecuta esto si el login es exitoso
        async function ejecutarApp() {
            // 1. Mostrar interfaz principal
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').classList.remove('hidden');

            try {
                // 2. Inicializar Firebase solo ahora
                const firebaseApp = initializeApp(config);
                const auth = getAuth(firebaseApp);
                const db = getFirestore(firebaseApp);

                await signInAnonymously(auth);

                // 3. Escuchar la base de datos
                const colRef = collection(db, 'artifacts', appID, 'public', 'data', 'ordenes');
                
                onSnapshot(colRef, (snapshot) => {
                    const lista = document.getElementById('lista-ordenes');
                    let html = '';
                    
                    if (snapshot.empty) {
                        lista.innerHTML = '<div class="col-span-full py-12 text-center text-slate-400 font-bold">Sin trabajos pendientes</div>';
                        return;
                    }

                    snapshot.forEach(docSnap => {
                        const d = docSnap.data();
                        html += `
                            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-all">
                                <div class="flex justify-between items-start mb-3">
                                    <h4 class="font-bold text-slate-800">${d.paciente}</h4>
                                    <button onclick="window.eliminar('${docSnap.id}')" class="text-slate-300 hover:text-red-500"><i class="fas fa-trash-alt"></i></button>
                                </div>
                                <div class="bg-blue-50 p-2 rounded-lg text-blue-600 text-xs font-bold mb-3 inline-block">
                                    ${d.armazon}
                                </div>
                                <div class="text-[11px] text-slate-500 space-y-1">
                                    <p><i class="fas fa-file-prescription mr-1"></i> Grad: ${d.graduacion || 'Sin dato'}</p>
                                    <p><i class="fas fa-flask mr-1"></i> Lab: ${d.laboratorio}</p>
                                </div>
                            </div>
                        `;
                    });
                    lista.innerHTML = html;
                });

                // Funcionalidad de Envío
                document.getElementById('form-orden').onsubmit = async (e) => {
                    e.preventDefault();
                    const b = e.target.querySelector('button');
                    b.disabled = true;
                    b.innerText = 'Procesando...';

                    try {
                        await addDoc(colRef, {
                            paciente: document.getElementById('paciente').value,
                            armazon: document.getElementById('armazon').value,
                            graduacion: document.getElementById('graduacion').value,
                            laboratorio: document.getElementById('laboratorio').value,
                            createdAt: serverTimestamp()
                        });
                        document.getElementById('modal-nueva').classList.add('hidden');
                        e.target.reset();
                    } finally {
                        b.disabled = false;
                        b.innerText = 'Cargar Trabajo';
                    }
                };

                // Función global para eliminar
                window.eliminar = async (id) => {
                    if(confirm("¿Seguro que quieres eliminar esta orden?")) {
                        await deleteDoc(doc(db, 'artifacts', appID, 'public', 'data', 'ordenes', id));
                    }
                };

            } catch (error) {
                console.error("Error de inicialización:", error);
                alert("Error conectando con la base de datos. Por favor reintenta.");
            }
        }
    </script>
</body>
</html>
