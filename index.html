            const loader = document.getElementById('login-loader');

        window.handleRegister = async () => {
            const u = document.getElementById('r-user').value.trim().toLowerCase();
            const p = document.getElementById('r-pass').value.trim();
            const loader = document.getElementById('r-loader');
            const err = document.getElementById('auth-error');
            if (!u || !p) { showMsg("Faltan datos", "red"); return; }

            if (!u || p.length < 4) { err.innerText = "Usuario y clave (min 4) requeridos"; err.classList.remove('hidden'); return; }
            loader.style.display = 'inline-block';
            msg.classList.add('hidden');

            loader.style.display = 'block';
            try {
                // Paso 1: Auth anónima para poder leer/escribir en Firestore
                await signInAnonymously(auth);
                const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', u);
                const snap = await getDoc(userRef);
                if (snap.exists()) {
                    err.innerText = "El usuario ya existe.";
                    err.classList.remove('hidden');
                
                // Paso 2: Referencia al documento del usuario
                // IMPORTANTE: Usamos la ruta obligatoria /artifacts/{appId}/public/data/users/ID
                const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'users', u);
                const snap = await getDoc(userDoc);

                if (mode === 'register') {
                    if (snap.exists()) {
                        showMsg("El usuario ya existe", "red");
                    } else {
                        await setDoc(userDoc, { pass: p, created: new Date().toISOString() });
                        showMsg("Cuenta creada correctamente. Ahora ingresa.", "green");
                    }
                } else {
                    await setDoc(userRef, { p, created: new Date().toISOString() });
                    alert("¡Cuenta creada! Ya puedes ingresar.");
                    setAuthTab('login');
                    if (snap.exists() && snap.data().pass === p) {
                        loginSuccess(u);
                    } else {
                        showMsg("Usuario o clave incorrectos", "red");
                    }
                }
            } catch (e) {
                err.innerText = "Error de conexión: " + e.message;
                err.classList.remove('hidden');
            } finally { loader.style.display = 'none'; }
                console.error(e);
                showMsg("Error de conexión. Prueba 'Entrar como invitado'", "orange");
            } finally {
                loader.style.display = 'none';
            }
        };

        window.handleLogin = async () => {
            const u = document.getElementById('l-user').value.trim().toLowerCase();
            const p = document.getElementById('l-pass').value.trim();
            const loader = document.getElementById('l-loader');
            const err = document.getElementById('auth-error');

            if (!u || !p) { err.innerText = "Ingresa credenciales"; err.classList.remove('hidden'); return; }

            loader.style.display = 'block';
            try {
                await signInAnonymously(auth);
                const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', u);
                const snap = await getDoc(userRef);
                if (snap.exists() && snap.data().p === p) {
                    currentUser = u;
                    sessionStorage.setItem('optica_user', u);
                    showApp();
                } else {
                    err.innerText = "Usuario o contraseña incorrectos";
                    err.classList.remove('hidden');
                }
            } catch (e) {
                err.innerText = "Error: " + e.message;
                err.classList.remove('hidden');
            } finally { loader.style.display = 'none'; }
        window.bypassAuth = () => {
            loginSuccess("Invitado_" + Math.floor(Math.random()*999));
        };

        function showApp() {
        function showMsg(text, color) {
            const msg = document.getElementById('auth-msg');
            msg.innerText = text;
            msg.className = `mt-4 text-center text-xs font-bold px-4 py-2 rounded-lg bg-${color}-50 text-${color}-600 border border-${color}-100`;
            msg.classList.remove('hidden');
        }

        function loginSuccess(username) {
            userSession = username;
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            document.getElementById('order-id-display').innerText = Math.floor(10000 + Math.random() * 89999);
            loadHistory();
            document.getElementById('order-id').innerText = "#" + Math.floor(10000 + Math.random() * 89999);
            initHistory();
        }

        window.logout = () => {
            sessionStorage.removeItem('optica_user');
            location.reload();
        };

        // --- APP LOGIC ---
        window.switchAppTab = (tab) => {
            document.getElementById('section-new').classList.toggle('hidden', tab !== 'new');
            document.getElementById('section-history').classList.toggle('hidden', tab !== 'history');
            document.getElementById('nav-new').className = `tab-btn ${tab === 'new' ? 'tab-active' : 'tab-inactive'}`;
            document.getElementById('nav-history').className = `tab-btn ${tab === 'history' ? 'tab-active' : 'tab-inactive'}`;
        // --- LÓGICA DE NAVEGACIÓN Y APP ---
        window.nav = (view) => {
            document.getElementById('view-new').classList.toggle('hidden', view !== 'new');
            document.getElementById('view-history').classList.toggle('hidden', view !== 'history');
        };

        document.getElementById('orderForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('order-id-display').innerText;
            const patient = document.getElementById('p_name').value;
            const treats = Array.from(document.querySelectorAll('input[name="treat"]:checked')).map(c => c.value).join(", ");
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = `ENVIANDO... <div class="loader" style="display:inline-block"></div>`;

            const orderId = document.getElementById('order-id').innerText.replace('#','');
            const treats = Array.from(document.querySelectorAll('.treat:checked')).map(c => c.value).join(", ");

            const orderData = {
                order_id: id,
                patient_name: patient,
                patient_id: document.getElementById('p_id').value,
                date: new Date().toLocaleString(),
                graduacion: `OD: ${document.getElementById('od_esf').value}/${document.getElementById('od_cil').value} x ${document.getElementById('od_eje').value} | OI: ${document.getElementById('oi_esf').value}/${document.getElementById('oi_cil').value} x ${document.getElementById('oi_eje').value}`,
                lens_details: document.getElementById('lens_type').value,
                treatments: treats || "Sin tratamientos",
                frame_details: `${document.getElementById('frame_mat').value} - ${document.getElementById('frame_mod').value}`,
            const formData = {
                order_id: orderId,
                user: userSession,
                patient: document.getElementById('p_name').value,
                contact: document.getElementById('p_contact').value,
                date: new Date().toLocaleString('es-AR'),
                grad_od: `${document.getElementById('od_esf').value} / ${document.getElementById('od_cil').value} x ${document.getElementById('od_eje').value} (Add ${document.getElementById('od_add').value})`,
                grad_oi: `${document.getElementById('oi_esf').value} / ${document.getElementById('oi_cil').value} x ${document.getElementById('oi_eje').value} (Add ${document.getElementById('oi_add').value})`,
                lens: document.getElementById('lens_type').value,
                treatments: treats || "Ninguno",
                frame: `${document.getElementById('frame_type').value} - ${document.getElementById('frame_model').value}`,
                notes: document.getElementById('notes').value
            };

            // 1. Guardar en Historial Local (Firestore)
            const histRef = doc(db, 'artifacts', appId, 'public', 'data', 'history', id);
            await setDoc(histRef, { ...orderData, user: currentUser });

            // 2. Enviar por EmailJS (Tus credenciales)
            try {
                await emailjs.send("service_bo6kzuc", "template_4e00pyr", orderData);
                alert("✅ Pedido enviado al Laboratorio y guardado.");
                // 1. Guardar en Firestore
                const histRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', orderId);
                await setDoc(histRef, formData);

                // 2. Enviar por EmailJS
                // SERVICE: service_bo6kzuc, TEMPLATE: template_4e00pyr
                await emailjs.send("service_bo6kzuc", "template_4e00pyr", {
                    to_name: "Laboratorio",
                    from_name: userSession,
                    message: `Nueva Orden #${orderId} de ${formData.patient}. Cristales: ${formData.lens}. Grad OD: ${formData.grad_od}`,
                    ...formData // Enviamos todo el objeto por si el template usa otros campos
                });

                alert("✅ TRABAJO ENVIADO CON ÉXITO");
                document.getElementById('orderForm').reset();
                loginSuccess(userSession); // Reset ID y vista
            } catch (err) {
                alert("⚠️ Guardado en historial, pero falló el envío de correo.");
                console.error(err);
                alert("⚠️ Se guardó el registro pero hubo un error enviando el email. Verifique su conexión.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `ENVIAR AL LABORATORIO <i class="fas fa-paper-plane"></i>`;
            }

            document.getElementById('orderForm').reset();
            switchAppTab('history');
        };

        function loadHistory() {
            const histCol = collection(db, 'artifacts', appId, 'public', 'data', 'history');
            onSnapshot(histCol, (snap) => {
                const container = document.getElementById('history-container');
                container.innerHTML = "";
        function initHistory() {
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
            onSnapshot(q, (snap) => {
                const list = document.getElementById('history-list');
                list.innerHTML = "";
                if(snap.empty) {
                    list.innerHTML = `<div class="p-8 text-center text-slate-400 bg-white rounded-xl border border-dashed">No hay trabajos registrados.</div>`;
                    return;
                }
                snap.forEach(doc => {
                    const data = doc.data();
                    const card = `
                        <div class="card p-4 border-l-4 border-blue-500">
                            <div class="flex justify-between">
                                <span class="text-xs font-bold text-blue-600">#${data.order_id}</span>
                                <span class="text-[10px] text-slate-400">${data.date}</span>
                    const d = doc.data();
                    const item = `
                        <div class="card p-4 hover:border-blue-300 transition-colors cursor-default">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <span class="text-[10px] font-black text-blue-600 uppercase">#${d.order_id}</span>
                                    <h4 class="font-bold text-slate-800">${d.patient}</h4>
                                </div>
                                <span class="text-[9px] text-slate-400 font-bold">${d.date}</span>
                            </div>
                            <div class="grid grid-cols-2 text-[11px] gap-2 border-t pt-2">
                                <div><span class="text-slate-400">Lente:</span> ${d.lens}</div>
                                <div><span class="text-slate-400">Óptica:</span> ${d.user}</div>
                            </div>
                            <h4 class="font-bold text-slate-800">${data.patient_name}</h4>
                            <p class="text-[11px] text-slate-500 mt-1">${data.graduacion}</p>
                        </div>
                    `;
                    container.innerHTML += card;
                    list.innerHTML += item;
                });
            }, (err) => {
                console.log("Error en historial:", err);
            });
        }

        // Auto-login si ya inició sesión
        const saved = sessionStorage.getItem('optica_user');
        if (saved) {
            currentUser = saved;
            showApp();
        }

    </script>
</body>
